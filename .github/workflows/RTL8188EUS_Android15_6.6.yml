name: Build RTL8188EUS Android 15 6.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / Android 15 6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Build RTL8188EUS module
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu
          cd rtl8188eu
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 clean

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Apply the same compatibility fixes that were retained in the validated
          # Android 15 / 6.6 workflow. Every edit is guarded to fail closed.
          p = Path("include/ieee80211.h")
          source = p.read_text()
          start = source.index("struct ieee80211_info_element {")
          end = source.index("} __attribute__((packed));", start)
          block = source[start:end]
          if "u8 data[0];" not in block:
              raise SystemExit("ieee80211_info_element data[0] declaration not found")
          source = source[:start] + block.replace("u8 data[0];", "u8 data[];", 1) + source[end:]
          p.write_text(source)

          source = p.read_text()
          start = source.index("struct ieee_param {")
          end = source.index("} ieee_param;", start)
          block = source[start:end]
          if "u8 key[0];" not in block:
              raise SystemExit("ieee_param key[0] declaration not found")
          p.write_text(source[:start] + block.replace("u8 key[0];", "u8 key[];", 1) + source[end:])

          p = Path("include/wlan_bssdef.h")
          source = p.read_text()
          start = source.index("struct _NDIS_802_11_VARIABLE_IEs")
          end = source.index("};", start)
          block = source[start:end]
          if "data[1]" not in block:
              raise SystemExit("NDIS variable IE data[1] declaration not found")
          p.write_text(source[:start] + block.replace("data[1]", "data[]", 1) + source[end:])

          p = Path("core/rtw_wlan_util.c")
          lines = p.read_text().splitlines()
          inserts = []
          for n, line in enumerate(lines):
              if line.strip() != "case _RSN_IE_2_:":
                  continue
              stop = next((m for m in range(n + 1, len(lines))
                           if lines[m].strip().startswith(("case ", "default:"))), len(lines))
              for m in range(n + 1, stop):
                  if lines[m].strip() in ("return _TRUE;", "return _FALSE;"):
                      if m + 1 >= len(lines) or lines[m + 1].strip() != "break;":
                          indent = line[:len(line) - len(line.lstrip())]
                          inserts.append((m + 1, indent + "break;"))
                      break
          if not inserts:
              raise SystemExit("No RSN return branches found for compatibility patch")
          for index, statement in reversed(inserts):
              lines.insert(index, statement)
          p.write_text("\n".join(lines) + "\n")

          p = Path("include/autoconf.h")
          source = p.read_text()
          if "#define CONFIG_IOCTL_CFG80211" not in source:
              source, count = re.subn(
                  r"^\s*/\*\s*#define CONFIG_IOCTL_CFG80211\s*\*/",
                  "#define CONFIG_IOCTL_CFG80211", source, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit("Cannot enable CONFIG_IOCTL_CFG80211")
          if "#define RTW_SINGLE_WIPHY" in source:
              raise SystemExit("RTW_SINGLE_WIPHY unexpectedly enabled")
          p.write_text(source)

          p = Path("os_dep/linux/ioctl_cfg80211.c")
          source = p.read_text()
          old = """#if CONFIG_RTW_MACADDR_ACL && (LINUX_VERSION_CODE >= KERNEL_VERSION(3, 9, 0))
          \twiphy->max_acl_mac_addrs = NUM_ACL;
          #endif"""
          new = """#if defined(CONFIG_AP_MODE) && CONFIG_RTW_MACADDR_ACL && (LINUX_VERSION_CODE >= KERNEL_VERSION(3, 9, 0))
          \twiphy->max_acl_mac_addrs = NUM_ACL;
          #endif"""
          if source.count(old) != 1:
              raise SystemExit("Cannot gate max_acl_mac_addrs on CONFIG_AP_MODE")
          p.write_text(source.replace(old, new, 1))

          p = Path("os_dep/osdep_service.c")
          source = p.read_text()
          ns = "MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);"
          if ns not in source:
              p.write_text(source.rstrip() + "\n\n" + ns + "\n")

          p = Path("os_dep/linux/ioctl_cfg80211.c")
          source = p.read_text()
          marker = "struct wiphy *rtw_wiphy_alloc(_adapter *padapter, struct device *dev)\n{"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("rtw_wiphy_alloc definition not found")
          end = source.find("\n}", start)
          if end < 0:
              raise SystemExit("rtw_wiphy_alloc end not found")
          block = source[start:end]
          if "set_wiphy_dev(wiphy, dev);" not in block:
              anchor = "\twiphy = wiphy_new("
              if anchor not in block:
                  raise SystemExit("wiphy_new allocation not found")
              alloc_end = block.find(";", block.find(anchor))
              if alloc_end < 0:
                  raise SystemExit("wiphy_new statement end not found")
              block = (block[:alloc_end + 1] +
                       "\n#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 0, 0))\n"
                       "\tset_wiphy_dev(wiphy, dev);\n#endif" +
                       block[alloc_end + 1:])
              p.write_text(source[:start] + block + source[end:])

          p = Path("os_dep/linux/ioctl_cfg80211.h")
          source = p.read_text()
          old = """#if (LINUX_VERSION_CODE < KERNEL_VERSION(3, 4, 0))  && !defined(COMPAT_KERNEL_RELEASE)
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, buf, len)
          #else
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, bss, buf, len)
          #endif"""
          new = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 0, 0)
          #define rtw_cfg80211_send_rx_assoc(adapter, arg_bss, arg_buf, arg_len) \
          do { \
              struct cfg80211_rx_assoc_resp assoc_resp = { \
                  .buf = (arg_buf), .len = (arg_len), .req_ies = NULL, .req_ies_len = 0, \
              }; \
              assoc_resp.links[0].bss = (arg_bss); \
              cfg80211_rx_assoc_resp((adapter)->pnetdev, &assoc_resp); \
          } while (0)
          #elif (LINUX_VERSION_CODE < KERNEL_VERSION(3, 4, 0)) && !defined(COMPAT_KERNEL_RELEASE)
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, buf, len)
          #else
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, bss, buf, len)
          #endif"""
          if source.count(old) != 1:
              raise SystemExit("Original cfg80211 association compatibility block not found exactly once")
          p.write_text(source.replace(old, new, 1))

          p = Path("os_dep/linux/ioctl_cfg80211.c")
          source = p.read_text()
          old = "cfg80211_send_disassoc(padapter->pnetdev, mgmt_buf, frame_len);"
          new = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 0, 0)
          \tcfg80211_tx_mlme_mgmt(padapter->pnetdev, mgmt_buf, frame_len, false);
          #else
          \tcfg80211_send_disassoc(padapter->pnetdev, mgmt_buf, frame_len);
          #endif"""
          if source.count(old) != 1:
              raise SystemExit("Legacy cfg80211 disassociation call not found exactly once")
          p.write_text(source.replace(old, new, 1))

          p = Path("hal/phydm/phydm_api.c")
          source = p.read_text()
          old = "if (power_offset > -8 || power_offset < 7)"
          if source.count(old) != 1:
              raise SystemExit("PHYDM TXAGC range condition not found exactly once")
          p.write_text(source.replace(old, "if (power_offset > -8 && power_offset < 7)", 1))

          p = Path("hal/phydm/phydm_debug.c")
          source = p.read_text()
          old = "if (rx_ht != 2 || rx_ht != 1)"
          if source.count(old) != 1:
              raise SystemExit("PHYDM rx_ht condition not found exactly once")
          p.write_text(source.replace(old, "if (rx_ht != 2 && rx_ht != 1)", 1))

          p = Path("hal/rtl8188e/usb/usb_halinit.c")
          source = p.read_text()
          old = "if ((IS_FULL_SPEED_USB(Adapter))"
          if source.count(old) != 1:
              raise SystemExit("USB speed condition not found exactly once")
          p.write_text(source.replace(old, "if (IS_FULL_SPEED_USB(Adapter)", 1))

          p = Path("core/rtw_odm.c")
          source = p.read_text()
          for call in (
              "_enter_critical_bh(&pHalData->IQKSpinLock, &irqL);",
              "_exit_critical_bh(&pHalData->IQKSpinLock, &irqL);",
          ):
              old = call + "\n\tdefault:"
              if source.count(old) != 1:
                  raise SystemExit(f"ODM switch branch not found exactly once: {call}")
              source = source.replace(old, call + "\n\t\tbreak;\n\tdefault:", 1)
          p.write_text(source)

          # KCFI crash fix: kernel ndo_start_xmit expects enum netdev_tx.
          # Keep vendor's legacy int-returning helper and call it through a
          # correctly typed Linux netdev entry point.
          p = Path("include/xmit_osdep.h")
          source = p.read_text()
          legacy = "extern int rtw_xmit_entry(_pkt *pkt, _nic_hdl pnetdev);"
          proto = "extern enum netdev_tx rtl8188eu_ndo_start_xmit(struct sk_buff *skb, struct net_device *dev);"
          if proto not in source:
              if source.count(legacy) != 1:
                  raise SystemExit("Legacy TX prototype not found uniquely")
              source = source.replace(legacy, legacy + "\\n" + proto, 1)
          p.write_text(source)

          p = Path("os_dep/linux/xmit_linux.c")
          source = p.read_text()
          legacy_def = "int rtw_xmit_entry(_pkt *pkt, _nic_hdl pnetdev)"
          wrapper = """enum netdev_tx rtl8188eu_ndo_start_xmit(struct sk_buff *skb, struct net_device *dev)
          {
              rtw_xmit_entry((_pkt *)skb, (_nic_hdl)dev);
              return NETDEV_TX_OK;
          }"""
          if source.count(legacy_def) != 1:
              raise SystemExit("Legacy TX function definition not found uniquely")
          if "enum netdev_tx rtl8188eu_ndo_start_xmit(" not in source:
              p.write_text(source.rstrip() + "\\n\\n" + wrapper + "\\n")

          # Rewrite all driver-tree ndo_start_xmit assignments, not just the
          # two station netdevs. This is important for monitor/virtual devices.
          replaced = 0
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix not in (".c", ".h", ".cc", ".cpp"):
                  continue
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated, count = re.subn(
                  r"(\bndo_start_xmit\s*=\s*)&?\s*rtw_xmit_entry\b",
                  r"\1rtl8188eu_ndo_start_xmit",
                  text)
              if count:
                  path.write_text(updated)
                  replaced += count
          if replaced < 2:
              raise SystemExit(f"Expected at least two legacy TX callback assignments, patched {replaced}")
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix not in (".c", ".h", ".cc", ".cpp"):
                  continue
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              if re.search(r"\bndo_start_xmit\s*=\s*&?\s*rtw_xmit_entry\b", text):
                  raise SystemExit(f"{path}: old TX callback remains assigned")

          # Other driver TX callbacks must have the exact kernel enum return type.
          for path, old, new in (
              ("os_dep/linux/ioctl_cfg80211.c",
               "static int rtw_cfg80211_monitor_if_xmit_entry(struct sk_buff *skb, struct net_device *ndev)",
               "static enum netdev_tx rtw_cfg80211_monitor_if_xmit_entry(struct sk_buff *skb, struct net_device *ndev)"),
              ("os_dep/linux/mlme_linux.c",
               "static int mgnt_xmit_entry(struct sk_buff *skb, struct net_device *pnetdev)",
               "static enum netdev_tx mgnt_xmit_entry(struct sk_buff *skb, struct net_device *pnetdev)"),
          ):
              p = Path(path)
              source = p.read_text()
              if source.count(old) == 1:
                  source = source.replace(old, new, 1)
              elif source.count(new) != 1:
                  raise SystemExit(f"{path}: expected TX callback signature not found uniquely")
              p.write_text(source)
          # Match tasklet_init's legacy unsigned-long callback ABI exactly.
          p = Path("include/usb_ops_linux.h")
          source = p.read_text()
          source, count = re.subn(
              r"void\s+usb_recv_tasklet\s*\([^;]+\)\s*;",
              "void usb_recv_tasklet(unsigned long priv);",
              source, count=1)
          if count != 1:
              raise SystemExit("usb_ops_linux.h: recv tasklet prototype not found exactly once")
          p.write_text(source)

          p = Path("os_dep/linux/usb_ops_linux.c")
          source = p.read_text()
          source, count = re.subn(
              r"void\s+usb_recv_tasklet\s*\([^)]*\)",
              "void usb_recv_tasklet(unsigned long priv)",
              source)
          if count != 2:
              raise SystemExit(f"usb_ops_linux.c: expected two recv tasklet definitions, changed {count}")
          source, count = re.subn(
              r"_adapter\s*\*\s*padapter\s*=\s*\(_adapter\s*\*\)\s*priv\s*;",
              "_adapter *padapter = (_adapter *)(uintptr_t)priv;",
              source, count=2)
          if count != 2:
              raise SystemExit(f"usb_ops_linux.c: expected two tasklet data conversions, changed {count}")
          p.write_text(source)

          p = Path("hal/hal_hci/hal_usb.c")
          source = p.read_text()
          pattern = re.compile(
              r"(tasklet_init\s*\(\s*&precvpriv->recv_tasklet\s*,\s*)"
              r"\(\s*void\s*\(\s*\*\s*\)\s*\(\s*unsigned\s+long\s*\)\s*\)\s*"
              r"usb_recv_tasklet",
              re.S)
          source, count = pattern.subn(r"\1usb_recv_tasklet", source, count=1)
          if count != 1 and not re.search(
              r"tasklet_init\s*\(\s*&precvpriv->recv_tasklet\s*,\s*usb_recv_tasklet\s*,",
              source, re.S):
              raise SystemExit("hal_usb.c: recv tasklet_init callback not found")
          p.write_text(source)

          PY

          # Match the Android common 6.6.127 cfg80211 declarations.
          mkdir -p "$GITHUB_WORKSPACE/kernel-headers/android15-6.6.127/include/net"
          ANDROID_CFG="$GITHUB_WORKSPACE/kernel-headers/android15-6.6.127/include/net/cfg80211.h"
          curl -fsSL \
            "https://android.googlesource.com/kernel/common/+/adaba3e91947a078e89f9990010e3adc2aafce7b/include/net/cfg80211.h?format=TEXT" \
            | base64 -d > "$ANDROID_CFG"
          test -s "$ANDROID_CFG"
          grep -q 'struct cfg80211_ops' "$ANDROID_CFG"
          mkdir -p "$KDIR/include/net"
          install -m 0644 "$ANDROID_CFG" "$KDIR/include/net/cfg80211.h"
          echo "DDK kernelrelease: $(make -s -C "$KDIR" kernelrelease)"
          sha256sum "$ANDROID_CFG"

          KCONFIG_AUTO="$KDIR/include/generated/autoconf.h"
          test -f "$KCONFIG_AUTO"
          sed -i '/^#define CONFIG_NL80211_TESTMODE\\b/d' "$KCONFIG_AUTO"
          mkdir -p "$GITHUB_WORKSPACE/out"

          COMMON_FLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE -DCONFIG_IOCTL_CFG80211 -Werror=incompatible-function-pointer-types"

          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 \
            CONFIG_RTL8188EU=m CONFIG_RTL8188E=y CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-UCONFIG_NL80211_TESTMODE $COMMON_FLAGS" modules
          test -s 8188eu.ko
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6-testmode-n.ko"

          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 \
            CONFIG_RTL8188EU=m CONFIG_RTL8188E=y CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_NL80211_TESTMODE $COMMON_FLAGS" modules
          test -s 8188eu.ko

          KCFI_ID=$(llvm-readelf -sW 8188eu.ko | awk '$8 == "__kcfi_typeid_rtl8188eu_ndo_start_xmit" {print $2}')
          test "$KCFI_ID" = "0000000044e57e43"
          TASKLET_KCFI_ID=$(llvm-readelf -sW 8188eu.ko | awk '$8 == "__kcfi_typeid_usb_recv_tasklet" {print $2}')
          test "$TASKLET_KCFI_ID" = "00000000aecee44b"

          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6-testmode-y.ko"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"

      - name: Upload RTL8188EUS kernel module variants
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android15-6.6
          path: out/8188eu-android15-6.6*.ko
          if-no-files-found: error
