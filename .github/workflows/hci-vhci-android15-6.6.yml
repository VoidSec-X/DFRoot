name: Build VHCI Android 15 6.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hci-vhci:
    name: hci_vhci.ko / ARM64 / Android 15 6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Build hci_vhci.ko
        shell: bash
        run: |
          set -euxo pipefail

          : "${KDIR:?DDK image did not provide KDIR}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/Module.symvers"
          test -f "$KDIR/include/generated/autoconf.h"
          test -f "$KDIR/drivers/bluetooth/hci_vhci.c"
          test -f "$KDIR/drivers/bluetooth/Makefile"

          echo "DDK kernelrelease: $(make -s -C "$KDIR" kernelrelease)"
          echo "Phone kernelrelease: 6.6.118-android15-8-o-g25c0665dd40c-4k"
          echo "CONFIG_BT_HCIVHCI in DDK:"
          grep -E '^(CONFIG_BT_HCIVHCI=|# CONFIG_BT_HCIVHCI is not set)' "$KDIR/.config" || true

          # Build only the kernel VHCI transport module. AIDL/HIDL are
          # userspace Bluetooth HAL APIs; hci_vhci.ko has no AIDL/HIDL variant.
          make -C "$KDIR" M="$KDIR/drivers/bluetooth" \
            ARCH=arm64 LLVM=1 CONFIG_BT_HCIVHCI=m modules

          MODULE="$KDIR/drivers/bluetooth/hci_vhci.ko"
          test -s "$MODULE"
          llvm-readelf -h "$MODULE" | grep -q 'AArch64'

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$MODULE" "$GITHUB_WORKSPACE/out/hci_vhci-android15-6.6-arm64.ko"

          if command -v modinfo >/dev/null 2>&1; then
            modinfo "$GITHUB_WORKSPACE/out/hci_vhci-android15-6.6-arm64.ko" \
              | tee "$GITHUB_WORKSPACE/out/modinfo.txt"
          fi
          llvm-readelf -sW "$GITHUB_WORKSPACE/out/hci_vhci-android15-6.6-arm64.ko" \
            > "$GITHUB_WORKSPACE/out/symbols.txt"
          sha256sum "$GITHUB_WORKSPACE/out/hci_vhci-android15-6.6-arm64.ko" \
            | tee "$GITHUB_WORKSPACE/out/SHA256SUMS"

      - name: Upload VHCI kernel module
        uses: actions/upload-artifact@v7
        with:
          name: hci-vhci-android15-6.6-arm64
          path: out/*
          if-no-files-found: error
