name: Build RNDIS USB Gadget Modules (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rndis-gadget-android15-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build RNDIS gadget modules
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828

    steps:
      - name: Fetch pinned Android 15 6.6 gadget sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/kernel/common "$GITHUB_WORKSPACE/kernel-common"
          cd "$GITHUB_WORKSPACE/kernel-common"
          git sparse-checkout set drivers/usb/gadget
          git fetch --depth=1 origin adaba3e91947a078e89f9990010e3adc2aafce7b
          git checkout --detach FETCH_HEAD
          G="$GITHUB_WORKSPACE/kernel-common/drivers/usb/gadget"
          F="$G/function"
          for file in "$G/Kconfig" "$G/Makefile" "$G/composite.c" "$G/configfs.c" "$G/functions.c" "$G/usbstring.c" "$G/config.c" "$G/epautoconf.c" "$G/u_f.c" "$G/configfs.h" "$F/Kconfig" "$F/Makefile" "$F/f_rndis.c" "$F/rndis.c" "$F/u_ether.c" "$F/u_ether.h" "$F/rndis.h" "$F/u_rndis.h" "$F/ndis.h" "$F/u_ether_configfs.h"; do
            test -s "$file"
          done
          echo "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/out/SOURCE_COMMIT.txt"

      - name: Prepare module build against DDK kernel headers
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK did not set KDIR}"
          test -s "$KDIR/.config"
          G="$GITHUB_WORKSPACE/kernel-common/drivers/usb/gadget"
          F="$G/function"
          OUT="$GITHUB_WORKSPACE/out"

          # Build function sources externally without pretending unavailable
          # config symbols exist in the pre-generated DDK .config.
          cat > "$G/Makefile" <<'EOF'
          ccflags-y += -I$(src) -I$(src)/function -I$(src)/udc
          obj-m += libcomposite.o
          libcomposite-y := usbstring.o config.o epautoconf.o composite.o functions.o configfs.o u_f.o
          EOF
          cat > "$F/Makefile" <<'EOF'
          ccflags-y += -I$(src)/.. -I$(src)/../udc
          obj-m += u_ether.o
          obj-m += usb_f_rndis.o
          usb_f_rndis-y := f_rndis.o rndis.o
          EOF

          make -C "$KDIR" M="$G" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$G" ARCH=arm64 LLVM=1 modules V=1
          make -C "$KDIR" M="$F" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$F" ARCH=arm64 LLVM=1 modules V=1

          for module in "$G/libcomposite.ko" "$F/u_ether.ko" "$F/usb_f_rndis.ko"; do
            test -s "$module"
            install -m 0644 "$module" "$OUT/"
          done

      - name: Validate outputs
        shell: bash
        run: |
          set -euxo pipefail
          for module in out/*.ko; do
            file "$module"
            modinfo "$module" | tee "out/$(basename "$module").modinfo.txt"
            modinfo -F vermagic "$module"
            llvm-readelf -h "$module" | grep -E 'Class:|Machine:'
          done
          (cd out && sha256sum *.ko > SHA256SUMS)
          {
            echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Modules: usb_f_rndis.ko, u_ether.ko, libcomposite.ko"
            echo "This is an external build against DDK headers; phone kernel ABI is not asserted."
            echo "Phone kernel previously reported by user: 6.6.118-android15-8-o-g25c0665dd40c-4k."
          } | tee out/README.txt

      - name: Upload RNDIS modules
        uses: actions/upload-artifact@v4
        with:
          name: rndis-modules-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
