name: Build RNDIS USB Gadget Modules (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rndis-gadget-android15-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate usb_f_rndis.ko
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828

    steps:
      - name: Configure RNDIS function as loadable modules
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK did not set KDIR}"
          test -f "$KDIR/Makefile"
          test -s "$KDIR/.config"
          mkdir -p out
          cp "$KDIR/.config" out/kernel-config-original.txt

          # USB_CONFIGFS_RNDIS is bool and selects USB_F_RNDIS=y.
          # Turn off that bool option and make configfs + its RNDIS
          # implementation tristates so Kconfig can produce real .ko files.
          set_config() {
            local key="$1" value="$2"
            if grep -q "^CONFIG_${key}=" "$KDIR/.config"; then
              sed -i "s/^CONFIG_${key}=.*/CONFIG_${key}=${value}/" "$KDIR/.config"
            else
              printf 'CONFIG_%s=%s\n' "$key" "$value" >> "$KDIR/.config"
            fi
          }
          set_config USB_GADGET y
          set_config NET y
          set_config INET y
          set_config USB_CONFIGFS m
          set_config USB_CONFIGFS_RNDIS n
          set_config USB_LIBCOMPOSITE m
          set_config USB_U_ETHER m
          set_config USB_F_RNDIS m
          make -C "$KDIR" ARCH=arm64 LLVM=1 olddefconfig

          for pair in USB_GADGET:y NET:y INET:y USB_CONFIGFS:m USB_CONFIGFS_RNDIS:n USB_LIBCOMPOSITE:m USB_U_ETHER:m USB_F_RNDIS:m; do
            key="${pair%:*}"
            value="${pair#*:}"
            if [ "$value" = n ]; then
              grep -q "^# CONFIG_${key} is not set$" "$KDIR/.config"
            else
              grep -q "^CONFIG_${key}=${value}$" "$KDIR/.config"
            fi
          done
          echo "Configured RNDIS as module; kernel release $(make -s -C "$KDIR" kernelrelease)"

      - name: Fetch pinned Android 15 6.6 USB gadget sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/kernel/common "$GITHUB_WORKSPACE/kernel-common"
          cd "$GITHUB_WORKSPACE/kernel-common"
          git sparse-checkout set drivers/usb/gadget
          git fetch --depth=1 origin adaba3e91947a078e89f9990010e3adc2aafce7b
          git checkout --detach FETCH_HEAD
          G="$GITHUB_WORKSPACE/kernel-common/drivers/usb/gadget"
          F="$G/$function"
          for file in "$G/Kconfig" "$G/Makefile" "$G/composite.c" "$G/configfs.c" "$G/functions.c" "$G/usbstring.c" "$G/config.c" "$G/epautoconf.c" "$G/u_f.c" "$F/Makefile" "$F/f_rndis.c" "$F/rndis.c" "$F/u_ether.c" "$F/u_ether.h" "$F/rndis.h" "$F/u_rndis.h" "$F/ndis.h" "$F/configfs.h" "$F/u_ether_configfs.h"; do
            test -s "$file"
          done
          echo "Pinned source commit: $(git rev-parse HEAD)"

      - name: Build libcomposite, u_ether and usb_f_rndis modules
        shell: bash
        run: |
          set -euxo pipefail
          G="$GITHUB_WORKSPACE/kernel-common/drivers/usb/gadget"
          F="$G/function"
          OUT="$GITHUB_WORKSPACE/out"

          # Build the actual composite core as a module from its in-tree
          # object list; preserve all sources and local gadget headers.
          cat > "$G/Makefile" <<'EOF'
          ccflags-y += -I$(src) -I$(src)/function -I$(src)/udc
          obj-m += libcomposite.o
          libcomposite-y := usbstring.o config.o epautoconf.o composite.o functions.o configfs.o u_f.o
          EOF
          cat > "$F/Makefile" <<'EOF'
          ccflags-y += -I$(src)/.. -I$(src)/../udc
          obj-m += u_ether.o
          obj-m += usb_f_rndis.o
          usb_f_rndis-y := f_rndis.o rndis.o
          EOF

          make -C "$KDIR" M="$G" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$G" ARCH=arm64 LLVM=1 modules V=1
          make -C "$KDIR" M="$F" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$F" ARCH=arm64 LLVM=1 modules V=1

          mkdir -p "$OUT"
          for module in "$G/libcomposite.ko" "$F/u_ether.ko" "$F/usb_f_rndis.ko"; do
            test -s "$module"
            install -m 0644 "$module" "$OUT/"
          done

      - name: Validate modules, dependencies and ARM64 ELF
        shell: bash
        run: |
          set -euxo pipefail
          for module in out/*.ko; do
            file "$module"
            modinfo "$module" | tee "out/$(basename "$module").modinfo.txt"
            modinfo -F vermagic "$module"
            llvm-readelf -h "$module" | grep -E 'Class:|Machine:'
          done
          grep -q '^CONFIG_USB_F_RNDIS=m$' "$KDIR/.config"
          grep -q '^CONFIG_USB_U_ETHER=m$' "$KDIR/.config"
          grep -q '^CONFIG_USB_LIBCOMPOSITE=m$' "$KDIR/.config"
          {
            echo "Build: RNDIS USB gadget function modules"
            echo "DDK: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "Kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Source: Android common commit adaba3e91947a078e89f9990010e3adc2aafce7b"
            echo "Modules: usb_f_rndis.ko, u_ether.ko, libcomposite.ko"
            echo "CONFIG_USB_CONFIGFS_RNDIS is disabled intentionally so CONFIG_USB_F_RNDIS can be modular."
            echo "Requires a compatible UDC and gadget configfs setup. This does not install or load modules."
            echo "Check exact phone vermagic, symbol CRCs and exported symbols; DDK 6.6.127-4k is not proven ABI-compatible with phone 6.6.118."
          } | tee out/README.txt
          (cd out && sha256sum *.ko > SHA256SUMS)

      - name: Upload RNDIS modules
        uses: actions/upload-artifact@v4
        with:
          name: rndis-modules-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
