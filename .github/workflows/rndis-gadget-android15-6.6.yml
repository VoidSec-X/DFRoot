name: Configure and validate RNDIS USB Gadget (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rndis-gadget-android15-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Enable and validate RNDIS configfs support
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828

    steps:
      - name: Enable RNDIS in the actual DDK kernel configuration
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK did not set KDIR}"
          test -f "$KDIR/Makefile"
          test -s "$KDIR/.config"
          echo "DDK release: $(make -s -C "$KDIR" kernelrelease)"
          mkdir -p out
          cp "$KDIR/.config" out/kernel-config-original.txt

          # Edit the config directly: this DDK image does not ship
          # scripts/config. Kconfig resolves selects/dependencies below.
          for symbol in USB USB_GADGET USB_CONFIGFS NET INET; do
            if grep -q "^CONFIG_${symbol}=" "$KDIR/.config"; then
              sed -i "s/^CONFIG_${symbol}=.*/CONFIG_${symbol}=y/" "$KDIR/.config"
            else
              printf 'CONFIG_%s=y\n' "$symbol" >> "$KDIR/.config"
            fi
          done

          # USB_CONFIGFS_RNDIS is a bool option, and selects USB_U_ETHER
          # and USB_F_RNDIS. Don't force selected tristates independently.
          if grep -q '^CONFIG_USB_CONFIGFS_RNDIS=' "$KDIR/.config"; then
            sed -i 's/^CONFIG_USB_CONFIGFS_RNDIS=.*/CONFIG_USB_CONFIGFS_RNDIS=y/' "$KDIR/.config"
          else
            printf 'CONFIG_USB_CONFIGFS_RNDIS=y\n' >> "$KDIR/.config"
          fi

          make -C "$KDIR" ARCH=arm64 LLVM=1 olddefconfig
          for symbol in USB USB_GADGET USB_CONFIGFS USB_CONFIGFS_RNDIS NET INET USB_LIBCOMPOSITE USB_U_ETHER USB_F_RNDIS; do
            grep -q "^CONFIG_${symbol}=y$" "$KDIR/.config" || {
              echo "::error::CONFIG_${symbol} is not enabled after Kconfig resolution."
              grep -E '^CONFIG_(USB|USB_GADGET|USB_CONFIGFS|USB_LIBCOMPOSITE|USB_U_ETHER|USB_F_RNDIS|NET|INET)' "$KDIR/.config" || true
              exit 1
            }
          done
          cp "$KDIR/.config" out/kernel-config-rndis.txt

      - name: Verify RNDIS sources and in-tree Kbuild mapping
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$DDK_ROOT/src"
          test -d "$SRC"
          # Search the actual DDK source tree instead of assuming upstream
          # subdirectory filenames or replacing its Kbuild Makefiles.
          RNDIS_SRC="$(find "$SRC" -path '*/drivers/usb/gadget/function/f_rndis.c' -type f -print -quit)"
          RNDIS_KCONFIG="$(find "$SRC" -path '*/drivers/usb/gadget/Kconfig' -type f -print -quit)"
          RNDIS_KBUILD="$(find "$SRC" -path '*/drivers/usb/gadget/function/Makefile' -type f -print -quit)"
          if [ -n "$RNDIS_SRC" ] && [ -n "$RNDIS_KCONFIG" ] && [ -n "$RNDIS_KBUILD" ]; then
            echo "RNDIS source: $RNDIS_SRC"
            grep -n -A7 -B2 'config USB_CONFIGFS_RNDIS' "$RNDIS_KCONFIG"
            grep -nE 'USB_F_RNDIS|usb_f_rndis|u_ether' "$RNDIS_KBUILD" || true
          else
            echo "DDK image contains prepared kernel headers/config but not the complete USB gadget source/Kbuild tree."
            echo "No standalone modules will be fabricated from unrelated external source files."
          fi

      - name: Validate effective config and create honest bundle
        shell: bash
        run: |
          set -euxo pipefail
          for symbol in USB_GADGET USB_CONFIGFS USB_CONFIGFS_RNDIS USB_LIBCOMPOSITE USB_U_ETHER USB_F_RNDIS NET INET; do
            grep -q "^CONFIG_${symbol}=y$" out/kernel-config-rndis.txt
          done
          {
            echo "RNDIS USB gadget config verification: PASS"
            echo "DDK image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "Kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Enabled: CONFIG_USB_GADGET, CONFIG_USB_CONFIGFS, CONFIG_USB_CONFIGFS_RNDIS"
            echo "Resolved dependencies: CONFIG_USB_LIBCOMPOSITE, CONFIG_USB_U_ETHER, CONFIG_USB_F_RNDIS"
            echo "Important: USB_CONFIGFS_RNDIS is a bool configfs option; it selects USB_F_RNDIS. With this configuration the RNDIS function is built into the kernel (=y), not emitted as usb_f_rndis.ko."
            echo "This is a validated config bundle, NOT an installable .ko module."
            echo "A working phone gadget additionally needs a USB Device Controller (UDC), configfs gadget setup, and Android USB gadget HAL/init integration."
            echo "DDK kernel release 6.6.127-4k is not proven ABI-compatible with the device's 6.6.118 kernel."
          } | tee out/README.txt
          (cd out && sha256sum kernel-config-original.txt kernel-config-rndis.txt README.txt > SHA256SUMS)
          test -s out/kernel-config-rndis.txt
          test -s out/README.txt

      - name: Upload validated RNDIS configuration
        uses: actions/upload-artifact@v4
        with:
          name: rndis-gadget-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
