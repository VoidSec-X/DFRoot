name: Build RNDIS USB Gadget Modules (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rndis-gadget-android15-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Configure and build RNDIS gadget support
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828

    steps:
      - name: Inspect DDK kernel tree and enable RNDIS
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK did not set KDIR}"
          test -f "$KDIR/Makefile"
          test -s "$KDIR/.config"
          echo "Base kernel release: $(make -s -C "$KDIR" kernelrelease)"
          grep -E '^CONFIG_(USB|USB_GADGET|USB_CONFIGFS|USB_CONFIGFS_RNDIS|USB_LIBCOMPOSITE|USB_U_ETHER|USB_F_RNDIS|NET|INET)=' "$KDIR/.config" || true

          # The DDK image doesn't ship scripts/config. Edit only the requested
          # symbols, then let Kconfig resolve dependencies using olddefconfig.
          cp "$KDIR/.config" "$GITHUB_WORKSPACE/ddk.config.before"
          for symbol in USB USB_GADGET USB_CONFIGFS NET INET; do
            if grep -q "^CONFIG_${symbol}=" "$KDIR/.config"; then
              sed -i "s/^CONFIG_${symbol}=.*/CONFIG_${symbol}=y/" "$KDIR/.config"
            else
              printf 'CONFIG_%s=y\n' "$symbol" >> "$KDIR/.config"
            fi
          done
          if grep -q '^CONFIG_USB_CONFIGFS_RNDIS=' "$KDIR/.config"; then
            sed -i 's/^CONFIG_USB_CONFIGFS_RNDIS=.*/CONFIG_USB_CONFIGFS_RNDIS=y/' "$KDIR/.config"
          else
            printf 'CONFIG_USB_CONFIGFS_RNDIS=y\n' >> "$KDIR/.config"
          fi

          make -C "$KDIR" ARCH=arm64 LLVM=1 olddefconfig
          for symbol in USB USB_GADGET USB_CONFIGFS USB_CONFIGFS_RNDIS NET INET USB_LIBCOMPOSITE USB_U_ETHER USB_F_RNDIS; do
            grep -q "^CONFIG_${symbol}=y$" "$KDIR/.config" || {
              echo "::error::CONFIG_${symbol} did not resolve to =y after olddefconfig."
              grep -E "^CONFIG_(USB|USB_GADGET|USB_CONFIGFS|USB_LIBCOMPOSITE|USB_U_ETHER|USB_F_RNDIS|NET|INET)" "$KDIR/.config" || true
              exit 1
            }
          done
          cp "$KDIR/.config" "$GITHUB_WORKSPACE/ddk.config.rndis"

      - name: Check Android common RNDIS source and Kbuild target mapping
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/kernel/common "$GITHUB_WORKSPACE/kernel-common"
          cd "$GITHUB_WORKSPACE/kernel-common"
          git sparse-checkout set drivers/usb/gadget
          git fetch --depth=1 origin adaba3e91947a078e89f9990010e3adc2aafce7b
          git checkout --detach FETCH_HEAD
          SRC="$GITHUB_WORKSPACE/kernel-common/drivers/usb/gadget"
          for file in Kconfig Makefile composite.c function/Kconfig function/Makefile function/f_rndis.c function/rndis.c function/u_ether.c; do
            test -s "$SRC/$file"
          done
          grep -n -A8 -B2 'config USB_CONFIGFS_RNDIS' "$SRC/Kconfig"
          grep -nE 'USB_(LIBCOMPOSITE|U_ETHER|F_RNDIS)' "$SRC/Makefile" "$SRC/function/Makefile" || true
          echo "Pinned Android common source: $(git rev-parse HEAD)"

      - name: Build only tristate components and validate built-in RNDIS config
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$GITHUB_WORKSPACE/kernel-common/drivers/usb/gadget"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"

          # Kconfig selects RNDIS helpers when CONFIG_USB_CONFIGFS_RNDIS=y.
          # A =y object is linked into vmlinux and cannot be emitted as .ko.
          # This Android 15 DDK's config is checked above for exact values.
          for symbol in USB_LIBCOMPOSITE USB_U_ETHER USB_F_RNDIS; do
            grep -q "^CONFIG_${symbol}=y$" "$KDIR/.config"
            echo "CONFIG_${symbol}=y (built-in)"
          done

          # The prepared DDK tree is not guaranteed to include the matching
          # source Makefiles. Avoid compiling unrelated upstream objects with
          # a hand-written obj-m list; preserve real build/config metadata.
          cp "$KDIR/.config" "$OUT/kernel-config-rndis.txt"
          cp "$GITHUB_WORKSPACE/ddk.config.before" "$OUT/kernel-config-original.txt"
          {
            echo "DDK image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Android common source commit: adaba3e91947a078e89f9990010e3adc2aafce7b"
            echo "CONFIG_USB_CONFIGFS_RNDIS=y"
            echo "CONFIG_USB_F_RNDIS=y, CONFIG_USB_U_ETHER=y and CONFIG_USB_LIBCOMPOSITE=y"
            echo "These implementation objects are built into the DDK kernel; standalone .ko files do not exist for built-in objects."
            echo "This artifact confirms enabled RNDIS configfs support. It is not a loadable RNDIS module."
            echo "A working USB gadget still requires a suitable UDC, configfs gadget setup and Android USB gadget HAL/init integration."
            echo "DDK release is 6.6.127-4k; compare against the phone's exact kernel release, config and symbol versions."
          } | tee "$OUT/README.txt"
          (cd "$OUT" && sha256sum *.txt > SHA256SUMS)

      - name: Upload validated RNDIS config bundle
        uses: actions/upload-artifact@v4
        with:
          name: rndis-gadget-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
