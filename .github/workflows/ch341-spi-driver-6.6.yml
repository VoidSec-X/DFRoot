name: Build CH341 USB-SPI Driver (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ch341-spi-driver-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate spi-ch341.ko
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Keep the exact same DDK image used by ch341-driver-6.6.yml.
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828

    steps:
      - name: Check DDK kernel build tree and USB/SPI core
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KDIR:-}" && test -f "$KDIR/Makefile" || {
            echo "::error::DDK kernel build tree (KDIR) is unavailable."
            exit 1
          }
          test -s "$KDIR/.config"
          echo "KDIR=$KDIR"
          echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"
          grep -E '^CONFIG_(USB|SPI|SPI_MASTER)=' "$KDIR/.config" | sort || true
          grep -Eq '^CONFIG_USB=(y|m)$' "$KDIR/.config" || {
            echo "::error::USB support is not enabled in the DDK config."
            exit 1
          }
          grep -Eq '^CONFIG_SPI=y$' "$KDIR/.config" || {
            echo "::error::CONFIG_SPI is not enabled in the DDK config."
            exit 1
          }
          grep -Eq '^CONFIG_SPI_MASTER=y$' "$KDIR/.config" || {
            echo "::error::CONFIG_SPI_MASTER is not enabled in the DDK config."
            exit 1
          }

      - name: Fetch latest upstream Linux CH341 SPI driver
        shell: bash
        run: |
          set -euo pipefail
          SRC_SHA=84182c48999f856c3865e4a537c244f9569c9f6c
          SRC="$GITHUB_WORKSPACE/ch341-spi"
          mkdir -p "$SRC" "$GITHUB_WORKSPACE/out"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/torvalds/linux/$SRC_SHA/drivers/spi/spi-ch341.c" \
            --output "$SRC/spi-ch341.c"
          test -s "$SRC/spi-ch341.c"
          grep -q 'module_usb_driver(ch341a_usb_driver)' "$SRC/spi-ch341.c"
          grep -q 'SPI_CONTROLLER_MUST_TX' "$SRC/spi-ch341.c"
          grep -q 'USB_DEVICE(0x1a86, 0x5512)' "$SRC/spi-ch341.c"
          echo "$SRC_SHA" | tee "$GITHUB_WORKSPACE/out/upstream-source-commit.txt"
          echo "Fetched torvalds/linux drivers/spi/spi-ch341.c at $SRC_SHA"

      - name: Build upstream spi-ch341 driver against Android 15 DDK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/ch341-spi"
          OUT="$GITHUB_WORKSPACE/out"
          printf 'obj-m += spi-ch341.o\n' > "$SRC/Makefile"
          make -C "$KDIR" M="$SRC" ARCH=arm64 LLVM=1 modules V=1
          test -s "$SRC/spi-ch341.ko"
          install -m 0644 "$SRC/spi-ch341.ko" "$OUT/spi-ch341.ko"

      - name: Validate module metadata and ARM64 ELF
        shell: bash
        run: |
          set -euo pipefail
          file out/spi-ch341.ko
          modinfo out/spi-ch341.ko | tee out/modinfo.txt
          test "$(modinfo -F name out/spi-ch341.ko)" = "spi_ch341"
          modinfo -F vermagic out/spi-ch341.ko | tee out/module-vermagic.txt
          modinfo -F alias out/spi-ch341.ko | tee out/module-aliases.txt
          grep -qi 'v1A86p5512' out/module-aliases.txt
          llvm-readelf -h out/spi-ch341.ko | grep -E 'Class:|Machine:'
          grep -Eq 'Machine:.*AArch64' < <(llvm-readelf -h out/spi-ch341.ko)
          {
            echo "Driver: upstream Linux CH341A USB-to-SPI controller."
            echo "Source: torvalds/linux drivers/spi/spi-ch341.c"
            echo "Source commit: $(cat out/upstream-source-commit.txt)"
            echo "Build image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "This is a build/package artifact; it is not installed or loaded on a phone."
            echo "The DDK build tree is not guaranteed to match the phone's exact 6.6.118 config, vermagic or symbol CRCs."
            echo "The driver registers an SPI controller. A userspace spidev binding is a separate kernel/device configuration step."
          } | tee out/README.txt
          sha256sum out/spi-ch341.ko | tee out/SHA256SUMS

      - name: Upload CH341 SPI module artifact
        uses: actions/upload-artifact@v4
        with:
          name: spi-ch341-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
