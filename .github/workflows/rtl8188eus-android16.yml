name: Build Aircrack-ng RTL8188EUS Module (Android 16)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS
        run: |
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Verify DDK environment
        run: |
          set -euxo pipefail
          test -n "$KDIR"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"
          test "$ARCH" = "arm64"
          test "$LLVM" = "1"
          printf 'KDIR=%s\nARCH=%s\nCROSS_COMPILE=%s\nLLVM=%s\n' "$KDIR" "$ARCH" "$CROSS_COMPILE" "$LLVM"
          grep -E '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_ARM64)=' "$KDIR/.config" || true

      - name: Build 8188eu.ko with the DFRoot DDK recipe
        working-directory: rtl8188eu
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK image did not set KDIR}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"

          make -C "$KDIR" M="$PWD" clean
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          # Fix Clang's bounds model for variable-length information elements.
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_struct_array(path, struct_name, member, old_decl, new_decl):
              p = Path(path)
              s = p.read_text()
              pattern = rf"(struct\\s+{re.escape(struct_name)}\\s*\\{{[^}}]*?)" + re.escape(old_decl)
              out, count = re.subn(pattern, lambda m: m.group(1) + new_decl, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: unable to patch {struct_name}.{member}")
              p.write_text(out)

          patch_struct_array(
              "include/ieee80211.h",
              "ieee80211_info_element",
              "data",
              "u8 data[0];",
              "u8 data[];"
          )

          p = Path("include/wlan_bssdef.h")
          s = p.read_text()
          old = "typedef struct _NDIS_802_11_VARIABLE_IEs {\\n\\tu8  ElementID;\\n\\tu8  Length;\\n\\tu8  data[1];\\n} NDIS_802_11_VARIABLE_IEs, *PNDIS_802_11_VARIABLE_IEs;"
          new = "typedef struct _NDIS_802_11_VARIABLE_IEs {\\n\\tu8  ElementID;\\n\\tu8  Length;\\n\\tu8  data[];\\n} NDIS_802_11_VARIABLE_IEs, *PNDIS_802_11_VARIABLE_IEs;"
          if old not in s:
              raise SystemExit("NDIS variable IE declaration not found")
          p.write_text(s.replace(old, new, 1))

          # The previous fall-through diagnostics are around beacon IE parsing.
          p = Path("core/rtw_wlan_util.c")
          lines = p.read_text().splitlines()
          begin = next(i for i, line in enumerate(lines) if line.startswith("void update_beacon_info("))
          finish = next(i for i in range(begin, len(lines)) if lines[i].startswith("#ifdef CONFIG_DFS"))
          block = lines[begin:finish]

          # Ensure every case arm exits the switch. Add the missing break directly
          # before default where the switch body currently has no terminating break.
          default_positions = [i for i, line in enumerate(block) if line.strip() == "default:"]
          if len(default_positions) != 1:
              raise SystemExit(f"update_beacon_info default labels: {len(default_positions)}")
          d = default_positions[0]
          if d == 0:
              raise SystemExit("default label has no preceding switch content")
          if block[d - 1].strip() != "break;":
              block.insert(d, "\\t\\t\\tbreak;")
          lines[begin:finish] = block
          p.write_text("\\n".join(lines) + "\\n")
          PY

          make -C "$KDIR" M="$PWD" \
            ARCH=arm64 \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules

          test -s 8188eu.ko
          llvm-nm -n 8188eu.ko >/dev/null
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data \
            8188eu.ko

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"

      - name: Upload RTL8188EUS module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android16-6.12
          path: out/8188eu-android16-6.12.ko
          if-no-files-found: error
