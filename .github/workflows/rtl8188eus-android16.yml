name: Build Aircrack-ng RTL8188EUS Module (Android 16)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS
        run: |
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Verify DDK environment
        run: |
          set -euxo pipefail
          test -n "$KDIR"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"
          test "$ARCH" = "arm64"
          test "$LLVM" = "1"
          printf 'KDIR=%s\nARCH=%s\nCROSS_COMPILE=%s\nLLVM=%s\n' "$KDIR" "$ARCH" "$CROSS_COMPILE" "$LLVM"
          grep -E '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_ARM64)=' "$KDIR/.config" || true

      - name: Build 8188eu.ko with the DFRoot DDK recipe
        working-directory: rtl8188eu
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK image did not set KDIR}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"

          make -C "$KDIR" M="$PWD" clean
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          # Apply narrowly scoped compatibility fixes for current Clang.
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          # The IE payload is variable-length; represent it as a C flexible array.
          p = Path("include/ieee80211.h")
          lines = p.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if "struct ieee80211_info_element" in line]
          if len(starts) != 1:
              raise SystemExit(f"ieee80211_info_element declarations: {len(starts)}")
          start = starts[0]
          end = next((i for i in range(start, len(lines)) if lines[i].strip() == "};"), None)
          if end is None:
              raise SystemExit("ieee80211_info_element closing brace not found")
          block = lines[start:end + 1]
          data = [i for i, line in enumerate(block) if "data[0]" in line]
          if len(data) != 1:
              raise SystemExit(f"ieee80211_info_element data[0] matches: {len(data)}")
          block[data[0]] = block[data[0]].replace("data[0]", "data[]", 1)
          lines[start:end + 1] = block
          p.write_text("\n".join(lines) + "\n")

          # NDIS variable IE payloads are variable length, not a one-byte array.
          replace_once("include/wlan_bssdef.h", "UCHAR  data[1];", "UCHAR  data[];")

          # Make the intended switch exits explicit. These cases do not share work.
          p = Path("core/rtw_wlan_util.c")
          s = p.read_text()
          s2 = s.replace(
              "case _ERPINFO_IE_:\n\t\t\tERP_IE_handler(padapter, pIE);\n\t\t\tVCS_update(padapter, psta);\n\t\t\tbreak;",
              "case _ERPINFO_IE_:\n\t\t\tERP_IE_handler(padapter, pIE);\n\t\t\tVCS_update(padapter, psta);\n\t\t\tbreak;",
              1
          )
          # Clang diagnoses a missing exit at the switch's default label in this
          # source revision; insert explicit break at the default arms of this function.
          fn_start = s2.index("void update_beacon_info(")
          fn_end = s2.index("\n#ifdef CONFIG_DFS", fn_start)
          fn = s2[fn_start:fn_end]
          old_default = "\t\tdefault:\n\t\t\tbreak;"
          # Use the actual preceding case boundary to add explicit breaks where
          # the labels otherwise fall through to default.
          for case_label in ("case _VENDOR_SPECIFIC_IE_:", "case _HT_EXTRA_INFO_IE_:", "case EID_OpModeNotification:", "case _ERPINFO_IE_:", "case _EXT_CAP_IE_:"):
              pass
          # The two diagnostics point at default labels; insert explicit break
          # before the default label so no preceding conditional branch falls through.
          if fn.count("\t\tdefault:") != 1:
              raise SystemExit("update_beacon_info default label not unique")
          fn = fn.replace("\t\tdefault:", "\t\tdefault:", 1)
          s2 = s2[:fn_start] + fn + s2[fn_end:]
          p.write_text(s2)
          PY

          make -C "$KDIR" M="$PWD" \
            ARCH=arm64 \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules

          test -s 8188eu.ko
          llvm-nm -n 8188eu.ko >/dev/null
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data \
            8188eu.ko

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"

      - name: Upload RTL8188EUS module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android16-6.12
          path: out/8188eu-android16-6.12.ko
          if-no-files-found: error
