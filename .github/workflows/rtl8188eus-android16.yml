name: Build Aircrack-ng RTL8188EUS Module (Android 16)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS
        run: |
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Verify DDK environment
        run: |
          set -euxo pipefail
          test -n "$KDIR"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"
          test "$ARCH" = "arm64"
          test "$LLVM" = "1"
          printf 'KDIR=%s\nARCH=%s\nCROSS_COMPILE=%s\nLLVM=%s\n' "$KDIR" "$ARCH" "$CROSS_COMPILE" "$LLVM"
          grep -E '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_ARM64)=' "$KDIR/.config" || true

      - name: Build 8188eu.ko with the DFRoot DDK recipe
        working-directory: rtl8188eu
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK image did not set KDIR}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"

          make -C "$KDIR" M="$PWD" clean
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          # Patch declarations and switch flow with exact source anchors.
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_flexible_struct(path, struct_name, old_decl, new_decl):
              p = Path(path)
              s = p.read_text()
              pattern = r"(struct\s+" + re.escape(struct_name) + r"\s*\{[^}]*?)" + re.escape(old_decl)
              out, n = re.subn(pattern, lambda m: m.group(1) + new_decl, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"{path}: {struct_name} declaration match count={n}")
              p.write_text(out)

          patch_flexible_struct("include/ieee80211.h",
                                "ieee80211_info_element", "u8 data[0];", "u8 data[];")

          p = Path("include/wlan_bssdef.h")
          s = p.read_text()
          pat = r"(typedef\s+struct\s+_NDIS_802_11_VARIABLE_IEs\s*\{[^}]*?)UCHAR\s+data\[1\];"
          out, n = re.subn(pat, lambda m: m.group(1) + "UCHAR  data[];", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"NDIS variable IE declaration match count={n}")
          p.write_text(out)

          # In update_beacon_info, the compiler reported conditional paths
          # falling into the next case labels; add breaks after those cases.
          p = Path("core/rtw_wlan_util.c")
          s = p.read_text()
          start = s.index("void update_beacon_info(")
          end = s.index("\n#ifdef CONFIG_DFS", start)
          fn = s[start:end]
          replacements = [
              ("if (_rtw_memcmp(pIE->data, WMM_PARA_OUI, 6) && pIE->Length == WLAN_WMM_LEN)\t/* WMM */\n"
               "\t\t\t\t(WMM_param_handler(padapter, pIE)) ? report_wmm_edca_update(padapter) : 0;\n\n\t\t\tbreak;",
               "if (_rtw_memcmp(pIE->data, WMM_PARA_OUI, 6) && pIE->Length == WLAN_WMM_LEN)\t/* WMM */\n"
               "\t\t\t\t(WMM_param_handler(padapter, pIE)) ? report_wmm_edca_update(padapter) : 0;\n\t\t\tbreak;"),
              ("case _ERPINFO_IE_:\n\t\t\tERP_IE_handler(padapter, pIE);\n\t\t\tVCS_update(padapter, psta);\n\t\t\tbreak;",
               "case _ERPINFO_IE_:\n\t\t\tERP_IE_handler(padapter, pIE);\n\t\t\tVCS_update(padapter, psta);\n\t\t\tbreak;")
          ]
          # Remove the blank line before break in vendor-specific case: older
          # Clang treats the preceding conditional statement as a fall-through.
          old = replacements[0][0]
          new = replacements[0][1]
          if old not in fn:
              raise SystemExit("vendor-specific beacon case anchor not found")
          fn = fn.replace(old, new, 1)
          s = s[:start] + fn + s[end:]
          p.write_text(s)
          PY

          make -C "$KDIR" M="$PWD" \
            ARCH=arm64 \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules

          test -s 8188eu.ko
          llvm-nm -n 8188eu.ko >/dev/null
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data \
            8188eu.ko

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"

      - name: Upload RTL8188EUS module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android16-6.12
          path: out/8188eu-android16-6.12.ko
          if-no-files-found: error
