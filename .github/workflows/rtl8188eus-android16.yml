name: Build Aircrack-ng RTL8188EUS Module (Android 16)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS
        run: |
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Verify DDK environment
        run: |
          set -euxo pipefail
          test -n "$KDIR"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"
          test "$ARCH" = "arm64"
          test "$LLVM" = "1"
          printf 'KDIR=%s\nARCH=%s\nCROSS_COMPILE=%s\nLLVM=%s\n' "$KDIR" "$ARCH" "$CROSS_COMPILE" "$LLVM"
          grep -E '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_ARM64)=' "$KDIR/.config" || true

      - name: Build 8188eu.ko with the DFRoot DDK recipe
        working-directory: rtl8188eu
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK image did not set KDIR}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"

          make -C "$KDIR" M="$PWD" clean
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          # Convert the information-element payload to a standard C flexible array.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("include/ieee80211.h")
          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if "struct ieee80211_info_element" in line]
          if len(starts) != 1:
              raise SystemExit(f"Expected one ieee80211_info_element declaration, found {len(starts)}")

          start = starts[0]
          end = next((i for i in range(start, len(lines)) if lines[i].strip() == "};"), None)
          if end is None:
              raise SystemExit("Could not find end of ieee80211_info_element declaration")

          body = lines[start:end + 1]
          data_lines = [i for i, line in enumerate(body) if "data[0]" in line]
          if len(data_lines) != 1:
              raise SystemExit(f"Expected one data[0] inside ieee80211_info_element, found {len(data_lines)}")

          idx = start + data_lines[0]
          lines[idx] = lines[idx].replace("data[0]", "data[]", 1)
          path.write_text("\n".join(lines) + "\n")

          verify = path.read_text().splitlines()
          start = next(i for i, line in enumerate(verify) if "struct ieee80211_info_element" in line)
          end = next(i for i in range(start, len(verify)) if verify[i].strip() == "};")
          block = "\n".join(verify[start:end + 1])
          if "data[]" not in block or "data[0]" in block:
              raise SystemExit("Flexible-array verification failed")
          print("Patched ieee80211_info_element.data[] successfully")
          PY

          make -C "$KDIR" M="$PWD" \
            ARCH=arm64 \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules

          test -s 8188eu.ko
          llvm-nm -n 8188eu.ko >/dev/null
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data \
            8188eu.ko

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"

      - name: Upload RTL8188EUS module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android16-6.12
          path: out/8188eu-android16-6.12.ko
          if-no-files-found: error
