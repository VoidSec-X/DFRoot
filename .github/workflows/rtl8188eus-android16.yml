name: Build Aircrack-ng RTL8188EUS Module (Android 16)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus-android16.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS
        run: |
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Verify DDK environment
        run: |
          set -euxo pipefail
          test -n "$KDIR"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"
          test "$ARCH" = "arm64"
          test "$LLVM" = "1"
          printf 'KDIR=%s\nARCH=%s\nCROSS_COMPILE=%s\nLLVM=%s\n' "$KDIR" "$ARCH" "$CROSS_COMPILE" "$LLVM"
          grep -E '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_ARM64)=' "$KDIR/.config" || true

      - name: Build 8188eu.ko with the DFRoot DDK recipe
        working-directory: rtl8188eu
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK image did not set KDIR}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/.config"

          make -C "$KDIR" M="$PWD" clean
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          # Deterministic Android 16 Clang compatibility fixes.
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 exact source match, got {n}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "include/ieee80211.h",
              "struct ieee80211_info_element {\n\tu8 id;\n\tu8 len;\n\tu8 data[0];\n}",
              "struct ieee80211_info_element {\n\tu8 id;\n\tu8 len;\n\tu8 data[];\n}"
          )
          replace_once(
              "include/wlan_bssdef.h",
              "typedef struct _NDIS_802_11_VARIABLE_IEs {\n\tu8  ElementID;\n\tu8  Length;\n\tu8  data[1];\n}",
              "typedef struct _NDIS_802_11_VARIABLE_IEs {\n\tu8  ElementID;\n\tu8  Length;\n\tu8  data[];\n}"
          )

          # Make the switch's unmatched/default arm explicit without changing
          # values handled by the preceding cases.
          p = Path("core/rtw_wlan_util.c")
          s = p.read_text()
          start = s.index("void update_beacon_info(")
          end = s.index("\\n#ifdef CONFIG_DFS", start)
          fn = s[start:end]
          marker = "\\t\\tdefault:\\n\\t\\t\\tbreak;"
          if fn.count(marker) != 1:
              raise SystemExit(f"update_beacon_info default case matches={fn.count(marker)}")
          fn = fn.replace(marker, "\\t\\tcase 0xff:\\n\\t\\t\\tbreak;\\n" + marker, 1)
          p.write_text(s[:start] + fn + s[end:])

          # Show the exact patched declarations and the affected switch.
          for path, needle in [
              ("include/ieee80211.h", "struct ieee80211_info_element {"),
              ("include/wlan_bssdef.h", "typedef struct _NDIS_802_11_VARIABLE_IEs {"),
              ("core/rtw_wlan_util.c", "void update_beacon_info("),
          ]:
              lines = Path(path).read_text().splitlines()
              idx = next(i for i, line in enumerate(lines) if needle in line)
              print(f"--- {path}:{idx+1} ---")
              for line in lines[idx:idx+12]:
                  print(line)
          PY

          make -C "$KDIR" M="$PWD" \
            ARCH=arm64 \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules

          test -s 8188eu.ko
          llvm-nm -n 8188eu.ko >/dev/null
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data \
            8188eu.ko

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android16-6.12.ko"

      - name: Upload RTL8188EUS module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android16-6.12
          path: out/8188eu-android16-6.12.ko
          if-no-files-found: error
