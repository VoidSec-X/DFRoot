name: Build VHCI Android 15 6.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vhci:
    name: hci_vhci.ko / Android 15 6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v7

      - name: Build hci_vhci.ko
        shell: bash
        run: |
          set -euxo pipefail

          : "${KDIR:?DDK image did not provide KDIR}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/drivers/bluetooth/Makefile"
          test -f "$KDIR/drivers/bluetooth/hci_vhci.c"

          echo "KDIR=$KDIR"
          echo "Kernel release: $(make -s -C "$KDIR" ARCH=arm64 LLVM=1 kernelrelease)"

          # Enable VHCI as a loadable module in the DDK kernel configuration.
          if [ -x "$KDIR/scripts/config" ]; then
            "$KDIR/scripts/config" --module BT
            "$KDIR/scripts/config" --module BT_HCIVHCI
            make -C "$KDIR" ARCH=arm64 LLVM=1 olddefconfig
          fi

          grep -E '^(CONFIG_BT|CONFIG_BT_HCIVHCI|CONFIG_MODULES|CONFIG_MODVERSIONS)=' "$KDIR/.config" || true

          # Build only the VHCI object; leave the RTL8188EUS workflows untouched.
          make -C "$KDIR" ARCH=arm64 LLVM=1 -j"$(nproc)" \
            CONFIG_BT=m CONFIG_BT_HCIVHCI=m \
            M="$KDIR/drivers/bluetooth" modules

          test -s "$KDIR/drivers/bluetooth/hci_vhci.ko"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$KDIR/drivers/bluetooth/hci_vhci.ko" "$GITHUB_WORKSPACE/out/"

          if command -v modinfo >/dev/null 2>&1; then
            modinfo "$GITHUB_WORKSPACE/out/hci_vhci.ko" | tee "$GITHUB_WORKSPACE/out/modinfo.txt"
          fi

          if [ -f "$KDIR/Module.symvers" ]; then
            cp "$KDIR/Module.symvers" "$GITHUB_WORKSPACE/out/Module.symvers"
          fi

          llvm-readelf -h "$GITHUB_WORKSPACE/out/hci_vhci.ko"

      - name: Upload VHCI module
        uses: actions/upload-artifact@v7
        with:
          name: hci-vhci-android15-6.6-arm64
          path: out/
          if-no-files-found: error
          retention-days: 14
