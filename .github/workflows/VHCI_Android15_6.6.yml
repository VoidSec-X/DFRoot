name: VHCI Android 15 6.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vhci:
    name: VHCI / android15-6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build hci_vhci.ko
        shell: bash
        run: |
          set -euxo pipefail

          : "${KDIR:?DDK did not set KDIR}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/drivers/bluetooth/Makefile"
          test -f "$KDIR/drivers/bluetooth/hci_vhci.c"

          echo "KDIR=$KDIR"
          echo "DDK kernelrelease: $(make -s -C "$KDIR" kernelrelease)"
          grep -E '^(CONFIG_MODULES|CONFIG_BT|CONFIG_BT_HCIVHCI|CONFIG_MODVERSIONS|CONFIG_KALLSYMS)=' "$KDIR/.config" || true

          # Use the DDK's prepared Android 15 / GKI 6.6 configuration and
          # symbol version data; do not reconfigure or replace the kernel tree.
          make -C "$KDIR" M="$KDIR/drivers/bluetooth" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$KDIR/drivers/bluetooth" ARCH=arm64 LLVM=1 \
            CONFIG_BT=m CONFIG_BT_HCIVHCI=m modules

          test -s "$KDIR/drivers/bluetooth/hci_vhci.ko"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$KDIR/drivers/bluetooth/hci_vhci.ko" "$GITHUB_WORKSPACE/out/hci_vhci.ko"

          # Keep metadata alongside the module for vermagic / dependency checks.
          modinfo "$GITHUB_WORKSPACE/out/hci_vhci.ko" | tee "$GITHUB_WORKSPACE/out/modinfo.txt"
          llvm-readelf -h "$GITHUB_WORKSPACE/out/hci_vhci.ko"
          if [ -f "$KDIR/Module.symvers" ]; then
            cp "$KDIR/Module.symvers" "$GITHUB_WORKSPACE/out/Module.symvers"
          fi

      - name: Upload VHCI module
        uses: actions/upload-artifact@v7
        with:
          name: hci-vhci-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
