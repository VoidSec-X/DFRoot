name: VHCI Android 15 6.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vhci:
    name: VHCI / android15-6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Android common kernel source
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK did not set KDIR}"
          test -f "$KDIR/Makefile"

          # The minimal DDK image has prepared headers/build metadata, but
          # deliberately does not ship the in-tree drivers/bluetooth source.
          # Fetch the exact Android common 6.6.127 source revision used for
          # this kernel family, then build VHCI as an external module.
          git clone --depth=1 https://android.googlesource.com/kernel/common "$GITHUB_WORKSPACE/kernel-common"
          cd "$GITHUB_WORKSPACE/kernel-common"
          git fetch --depth=1 origin adaba3e91947a078e89f9990010e3adc2aafce7b
          git checkout --detach FETCH_HEAD

          test -f drivers/bluetooth/hci_vhci.c
          test -f drivers/bluetooth/Makefile
          echo "Kernel source: $(git rev-parse HEAD)"
          echo "DDK kernelrelease: $(make -s -C "$KDIR" kernelrelease)"

          # Use the DDK's configured kernel build tree and symbol CRCs, while
          # compiling the source file from the matching Android common tree.
          make -C "$KDIR" M="$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth" \
            ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth" \
            ARCH=arm64 LLVM=1 CONFIG_BT=m CONFIG_BT_HCIVHCI=m modules

          test -s "$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth/hci_vhci.ko"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth/hci_vhci.ko" \
            "$GITHUB_WORKSPACE/out/hci_vhci.ko"

          modinfo "$GITHUB_WORKSPACE/out/hci_vhci.ko" | tee "$GITHUB_WORKSPACE/out/modinfo.txt"
          llvm-readelf -h "$GITHUB_WORKSPACE/out/hci_vhci.ko"
          if [ -f "$KDIR/Module.symvers" ]; then
            cp "$KDIR/Module.symvers" "$GITHUB_WORKSPACE/out/Module.symvers"
          fi

      - name: Upload VHCI module
        uses: actions/upload-artifact@v7
        with:
          name: hci-vhci-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
