name: Build RTL8188EUS Module

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android15-6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot workflow repository
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS driver
        run: |
          git clone --depth=1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Build 8188eu.ko
        working-directory: rtl8188eu
        env:
          ARCH: arm64
          SUBARCH: arm64
        shell: bash
        run: |
          set -euxo pipefail

          : "${KERNEL_SRC:?DDK image did not set KERNEL_SRC}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KERNEL_SRC/Makefile"
          test -f "$KERNEL_SRC/.config"

          # Apply minimal source-level compatibility fixes: missing switch breaks
          # were accidental fall-through, and IE data is a variable-length tail.
          python3 - <<'PY'
          from pathlib import Path

          util = Path("core/rtw_wlan_util.c")
          src = util.read_text()
          src = src.replace(
              """\t\t\tcase _RSN_IE_2_:
          \t\t\t\tif (_rtw_memcmp((pIE->data + 8), RSN_TKIP_CIPHER, 4))
          \t\t\t\t\treturn _TRUE;

          \t\t\tdefault:""",
              """\t\t\tcase _RSN_IE_2_:
          \t\t\t\tif (_rtw_memcmp((pIE->data + 8), RSN_TKIP_CIPHER, 4))
          \t\t\t\t\treturn _TRUE;
          \t\t\t\tbreak;

          \t\t\tdefault:""",
              1,
          )
          src = src.replace(
              """\t\t\tcase _RSN_IE_2_:
          \t\t\t\tif ((_rtw_memcmp((pIE->data + 8), RSN_CIPHER_SUITE_CCMP, 4))  ||
          \t\t\t\t    (_rtw_memcmp((pIE->data + 12), RSN_CIPHER_SUITE_CCMP, 4)))
          \t\t\t\t\treturn _FALSE;

          \t\t\tdefault:""",
              """\t\t\tcase _RSN_IE_2_:
          \t\t\t\tif ((_rtw_memcmp((pIE->data + 8), RSN_CIPHER_SUITE_CCMP, 4))  ||
          \t\t\t\t    (_rtw_memcmp((pIE->data + 12), RSN_CIPHER_SUITE_CCMP, 4)))
          \t\t\t\t\treturn _FALSE;
          \t\t\t\tbreak;

          \t\t\tdefault:""",
              1,
          )
          if "case _RSN_IE_2_:" not in src:
              raise SystemExit("Expected RSN switch cases not found")
          util.write_text(src)

          # Convert legacy one-byte trailing IE arrays to flexible arrays.
          bss = Path("include/wlan_bssdef.h")
          text = bss.read_text()
          old = "\tUCHAR  data[1];"
          if old not in text:
              raise SystemExit("Expected variable IE data[1] declaration not found")
          bss.write_text(text.replace(old, "\tUCHAR  data[];", 1))
          PY

          # Build with the DDK's Android ARM64 kernel/toolchain; no warning suppression.
          make -C "$KERNEL_SRC" M="$PWD" clean || true
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          make -C "$KERNEL_SRC" \
            M="$PWD" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules V=1

          test -s 8188eu.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko" || true

      - name: Upload RTL8188EUS kernel module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android15-6.6
          path: out/8188eu-android15-6.6.ko
          if-no-files-found: error
