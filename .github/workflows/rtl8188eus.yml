name: Build RTL8188EUS Module

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android15-6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot workflow repository
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS driver
        run: |
          git clone --depth=1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Patch legacy IE declarations and parsing
        working-directory: rtl8188eu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(source.replace(old, new, 1))

          # Convert only the actual information-element payload member.
          ieee = Path("include/ieee80211.h")
          source = ieee.read_text()
          pattern = re.compile(
              r"(struct\s+ieee80211_info_element\s*\{[^}]*?\bu8\s+data)\[0\](\s*;\s*\})",
              re.S,
          )
          source, count = pattern.subn(r"\1[]\2", source, count=1)
          if count != 1:
              raise SystemExit("struct ieee80211_info_element data[0] declaration not found exactly once")
          ieee.write_text(source)

          replace_once(
              "include/wlan_bssdef.h",
              "\tUCHAR  data[1];",
              "\tUCHAR  data[];",
          )

          # Guard channel-switch payload reads by their declared IE lengths.
          replace_once(
              "core/rtw_mlme_ext.c",
              """\t\t\tif (ie->id == WLAN_EID_CHANNEL_SWITCH) {
          \t\t\t\tch_switch_mode = ie->data[0];""",
              """\t\t\tif (ie->id == WLAN_EID_CHANNEL_SWITCH) {
          \t\t\t\tif (ie->len < 3)
          \t\t\t\t\tcontinue;
          \t\t\t\tch_switch_mode = ie->data[0];""",
          )
          replace_once(
              "core/rtw_mlme_ext.c",
              """\t\t\t} else if (ie->id == WLAN_EID_SECONDARY_CHANNEL_OFFSET) {
          \t\t\t\tch_offset = secondary_ch_offset_to_hal_ch_offset(ie->data[0]);""",
              """\t\t\t} else if (ie->id == WLAN_EID_SECONDARY_CHANNEL_OFFSET) {
          \t\t\t\tif (ie->len < 1)
          \t\t\t\t\tcontinue;
          \t\t\t\tch_offset = secondary_ch_offset_to_hal_ch_offset(ie->data[0]);""",
          )

          # Preserve switch semantics: no fall-through when an RSN case does not match.
          util = Path("core/rtw_wlan_util.c")
          source = util.read_text()
          old_cases = [
              """\t\t\tcase _RSN_IE_2_:
          \t\t\t\tif (_rtw_memcmp((pIE->data + 8), RSN_TKIP_CIPHER, 4))
          \t\t\t\t\treturn _TRUE;

          \t\t\tdefault:""",
              """\t\t\tcase _RSN_IE_2_:
          \t\t\t\tif ((_rtw_memcmp((pIE->data + 8), RSN_CIPHER_SUITE_CCMP, 4))  ||
          \t\t\t\t    (_rtw_memcmp((pIE->data + 12), RSN_CIPHER_SUITE_CCMP, 4)))
          \t\t\t\t\treturn _FALSE;

          \t\t\tdefault:""",
          ]
          for old in old_cases:
              if source.count(old) != 1:
                  raise SystemExit("Expected RSN case with accidental fall-through not found exactly once")
          source = source.replace(
              old_cases[0],
              old_cases[0].replace("\n\n\t\t\tdefault:", "\n\t\t\t\tbreak;\n\n\t\t\tdefault:"),
              1,
          )
          source = source.replace(
              old_cases[1],
              old_cases[1].replace("\n\n\t\t\tdefault:", "\n\t\t\t\tbreak;\n\n\t\t\tdefault:"),
              1,
          )
          util.write_text(source)
          PY

      - name: Build 8188eu.ko
        working-directory: rtl8188eu
        env:
          ARCH: arm64
          SUBARCH: arm64
        shell: bash
        run: |
          set -euxo pipefail

          : "${KERNEL_SRC:?DDK image did not set KERNEL_SRC}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KERNEL_SRC/Makefile"
          test -f "$KERNEL_SRC/.config"

          make -C "$KERNEL_SRC" M="$PWD" clean
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          make -C "$KERNEL_SRC" \
            M="$PWD" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules V=1

          test -s 8188eu.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"

      - name: Upload RTL8188EUS kernel module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android15-6.6
          path: out/8188eu-android15-6.6.ko
          if-no-files-found: error
