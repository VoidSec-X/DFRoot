name: Build RTL8188EUS Module

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android15-6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot workflow repository
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS driver
        run: |
          git clone --depth=1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Patch legacy IE declarations and parsing
        working-directory: rtl8188eu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(source.replace(old, new, 1))

          # Convert zero-length tail only in the Linux ieee80211_info_element.
          ieee = Path("include/ieee80211.h")
          source = ieee.read_text()
          old = """struct ieee80211_info_element {
          \tu8 id;
          \tu8 len;
          \tu8 data[0];
          } __attribute__((packed));"""
          new = old.replace("u8 data[0];", "u8 data[];")
          if source.count(old) != 1:
              raise SystemExit("Linux ieee80211_info_element definition not found exactly once")
          ieee.write_text(source.replace(old, new, 1))

          replace_once(
              "include/wlan_bssdef.h",
              "\tUCHAR  data[1];",
              "\tUCHAR  data[];",
          )

          # Bound the channel-switch IE payload before reading its fields.
          mlme = Path("core/rtw_mlme_ext.c")
          source = mlme.read_text()
          source, count = re.subn(
              r"(if \(ie->id == WLAN_EID_CHANNEL_SWITCH\) \{\n)(\s*)(ch_switch_mode = ie->data\[0\];)",
              r"\1\2if (ie->len < 3)\n\2\tcontinue;\n\2\3",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Channel-switch IE length guard insertion failed")
          source, count = re.subn(
              r"(else if \(ie->id == WLAN_EID_SECONDARY_CHANNEL_OFFSET\) \{\n)(\s*)(ch_offset = secondary_ch_offset_to_hal_ch_offset\(ie->data\[0\]\);)",
              r"\1\2if (ie->len < 1)\n\2\tcontinue;\n\2\3",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Secondary-channel IE length guard insertion failed")
          mlme.write_text(source)

          # Terminate both RSN switch branches before default; match semantic lines.
          util = Path("core/rtw_wlan_util.c")
          source = util.read_text()
          source, first = re.subn(
              r"(case _RSN_IE_2_:\n\s*if \(_rtw_memcmp\(\(pIE->data \+ 8\), RSN_TKIP_CIPHER, 4\)\)\n\s*return _TRUE;)\n\s*(default:)",
              lambda m: m.group(1) + "\n\t\t\t\tbreak;\n\n\t\t\t" + m.group(2),
              source,
              count=1,
          )
          if first != 1:
              raise SystemExit("TKIP RSN switch branch fix failed")
          source, second = re.subn(
              r"(case _RSN_IE_2_:\n\s*if \(\(_rtw_memcmp\(\(pIE->data \+ 8\), RSN_CIPHER_SUITE_CCMP, 4\)\)\s*\|\|\s*\(_rtw_memcmp\(\(pIE->data \+ 12\), RSN_CIPHER_SUITE_CCMP, 4\)\)\)\n\s*return _FALSE;)\n\s*(default:)",
              lambda m: m.group(1) + "\n\t\t\t\tbreak;\n\n\t\t\t" + m.group(2),
              source,
              count=1,
          )
          if second != 1:
              raise SystemExit("CCMP RSN switch branch fix failed")
          util.write_text(source)
          PY

      - name: Build 8188eu.ko
        working-directory: rtl8188eu
        env:
          ARCH: arm64
          SUBARCH: arm64
        shell: bash
        run: |
          set -euxo pipefail

          : "${KERNEL_SRC:?DDK image did not set KERNEL_SRC}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KERNEL_SRC/Makefile"
          test -f "$KERNEL_SRC/.config"

          make -C "$KERNEL_SRC" M="$PWD" clean
          find . -type f \( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \) -delete

          make -C "$KERNEL_SRC" \
            M="$PWD" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \
            modules V=1

          test -s 8188eu.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"

      - name: Upload RTL8188EUS kernel module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android15-6.6
          path: out/8188eu-android15-6.6.ko
          if-no-files-found: error
