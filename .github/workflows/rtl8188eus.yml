name: Build RTL8188EUS Module

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rtl8188eus.yml"
  pull_request:
    paths:
      - ".github/workflows/rtl8188eus.yml"

permissions:
  contents: read

jobs:
  build-rtl8188eus:
    name: RTL8188EUS / android15-6.6
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout DFRoot workflow repository
        uses: actions/checkout@v7

      - name: Clone Aircrack-ng RTL8188EUS driver
        run: |
          git clone --depth=1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu

      - name: Build 8188eu.ko
        working-directory: rtl8188eu
        env:
          ARCH: arm64
          SUBARCH: arm64
        shell: bash
        run: |
          set -euxo pipefail

          : "${KERNEL_SRC:?DDK image did not set KERNEL_SRC}"
          : "${CROSS_COMPILE:?DDK image did not set CROSS_COMPILE}"
          test -f "$KERNEL_SRC/Makefile"
          test -f "$KERNEL_SRC/.config"

          # The upstream standalone Makefile defaults CONFIG_PLATFORM_I386_PC=y,
          # which overrides the DDK toolchain/target. Disable that host preset
          # and build the driver's Kbuild target directly for the prepared arm64 tree.
          make -C "$KERNEL_SRC" \
            M="$PWD" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            CONFIG_RTL8188EU=m \
            CONFIG_RTL8188E=y \
            CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_I386_PC=n \
            KBUILD_EXTMOD="$PWD" \
            modules V=1

          test -s 8188eu.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          file "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko"
          modinfo "$GITHUB_WORKSPACE/out/8188eu-android15-6.6.ko" || true

      - name: Upload RTL8188EUS kernel module
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-android15-6.6
          path: out/8188eu-android15-6.6.ko
          if-no-files-found: error
