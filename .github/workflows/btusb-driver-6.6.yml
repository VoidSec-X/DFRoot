name: Build btusb Bluetooth USB Driver (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btusb-driver-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate btusb.ko
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Fetch pinned Android common Bluetooth sources
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK did not set KDIR}"
          : "${DDK_ROOT:?DDK_ROOT is not set}"
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/kernel/common "$GITHUB_WORKSPACE/kernel-common"
          cd "$GITHUB_WORKSPACE/kernel-common"
          git sparse-checkout set drivers/bluetooth
          git fetch --depth=1 origin adaba3e91947a078e89f9990010e3adc2aafce7b
          git checkout --detach FETCH_HEAD
          SRC="$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth"
          for file in btusb.c btintel.c btintel.h btbcm.c btbcm.h btrtl.c btrtl.h btmtk.c btmtk.h btqca.c btqca.h; do
            test -s "$SRC/$file"
          done
          echo "Pinned Android common source: $(git rev-parse HEAD)"
          echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"

      - name: Configure and build btusb plus helpers
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          scripts="$DDK_ROOT/src/android15-6.6/scripts/config"
          if [ ! -x "$scripts" ]; then
            scripts="$(find "$DDK_ROOT/src" -path '*/scripts/config' -type f -executable -print -quit)"
          fi
          test -x "$scripts"
          "$scripts" --file "$KDIR/.config" -e BT
          "$scripts" --file "$KDIR/.config" -e USB
          make -C "$KDIR" ARCH=arm64 LLVM=1 olddefconfig
          grep -Eq '^CONFIG_BT=y$|^CONFIG_BT=m$' "$KDIR/.config"
          grep -Eq '^CONFIG_USB=y$|^CONFIG_USB=m$' "$KDIR/.config"

          # External-module builds require obj-m entries. The in-tree
          # Bluetooth Makefile is driven by Kconfig symbols and was omitting
          # btusb from this DDK's effective module target list.
          cat > "$SRC/Makefile" <<'EOF'
          obj-m += btusb.o
          obj-m += btintel.o
          obj-m += btbcm.o
          obj-m += btrtl.o
          obj-m += btmtk.o
          obj-m += btqca.o
          EOF
          make -C "$KDIR" M="$SRC" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$SRC" ARCH=arm64 LLVM=1 modules V=1
          test -s "$SRC/btusb.ko"
          install -m 0644 "$SRC/btusb.ko" "$OUT/btusb.ko"
          for module in btintel btbcm btrtl btmtk btqca; do
            test -s "$SRC/$module.ko"
            install -m 0644 "$SRC/$module.ko" "$OUT/$module.ko"
          done

      - name: Validate module metadata and ARM64 ELF
        shell: bash
        run: |
          set -euo pipefail
          test -s out/btusb.ko
          file out/*.ko
          for module in out/*.ko; do
            modinfo "$module" | tee "out/$(basename "$module").modinfo.txt"
            modinfo -F vermagic "$module"
            llvm-readelf -h "$module" | grep -E 'Class:|Machine:'
          done
          {
            echo "Build image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "Android common source: adaba3e91947a078e89f9990010e3adc2aafce7b"
            echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Primary driver: btusb.ko (USB Bluetooth HCI transport)."
            echo "Helper modules built from the same pinned source tree."
            echo "Check exact device vermagic, symbol CRCs, dependencies, firmware and kernel config before loading."
            echo "Build/package only; no device installation or module loading."
          } | tee out/README.txt
          (cd out && sha256sum *.ko > SHA256SUMS)

      - name: Upload Bluetooth USB driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btusb-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
