name: Build btusb Bluetooth USB Driver (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btusb-driver-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate btusb.ko
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828

    steps:
      - name: Check DDK kernel source and configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${KDIR:?DDK KDIR is not set}"
          : "${KERNEL_SRC:?DDK KERNEL_SRC is not set}"
          test -f "$KDIR/Makefile"
          test -f "$KERNEL_SRC/Makefile"
          test -s "$KDIR/.config"
          grep -Eq '^CONFIG_BT=m$' "$KDIR/.config"
          grep -Eq '^CONFIG_USB=y$|^CONFIG_USB=m$' "$KDIR/.config"
          echo "Kernel release: $(make -s -C "$KDIR" kernelrelease)"
          echo "Kernel source: $KERNEL_SRC"
          test -s "$KERNEL_SRC/drivers/bluetooth/btusb.c" || {
            echo "::error::DDK-matched btusb.c not found in KERNEL_SRC."
            exit 1
          }

      - name: Build btusb using DDK-matched in-tree sources
        shell: bash
        run: |
          set -euo pipefail
          SRC="$KERNEL_SRC/drivers/bluetooth"
          OUT="$GITHUB_WORKSPACE/out"
          test -s "$SRC/btusb.c"
          test -s "$SRC/Makefile"
          test -s "$SRC/Kconfig"
          mkdir -p "$OUT"
          # Use the driver's own Kbuild rules and the exact source/header set
          # shipped with this Android 15 6.6 DDK, not upstream headers mixed
          # with downstream Android Bluetooth headers.
          make -C "$KDIR" M="$SRC" ARCH=arm64 LLVM=1 CONFIG_BT_HCIBTUSB=m modules V=1
          test -s "$SRC/btusb.ko"
          install -m 0644 "$SRC/btusb.ko" "$OUT/btusb.ko"
          for module in btintel btbcm btrtl btmtk btqca; do
            if test -s "$SRC/$module.ko"; then
              install -m 0644 "$SRC/$module.ko" "$OUT/$module.ko"
            fi
          done

      - name: Validate module and package metadata
        shell: bash
        run: |
          set -euo pipefail
          file out/*.ko
          for module in out/*.ko; do
            modinfo "$module" | tee "out/$(basename "$module").modinfo.txt"
            modinfo -F vermagic "$module"
            llvm-readelf -h "$module" | grep -E 'Class:|Machine:'
          done
          {
            echo "Build image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "Kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Primary driver: btusb.ko (USB Bluetooth HCI transport)."
            echo "Built using the DDK-matched in-tree Bluetooth sources."
            echo "Compare vermagic, symbol CRCs, dependencies, firmware and kernel config before loading."
            echo "Build/package only; no device installation or module loading."
          } | tee out/README.txt
          (cd out && sha256sum *.ko > SHA256SUMS)

      - name: Upload Bluetooth USB driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btusb-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
