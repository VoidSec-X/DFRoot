name: Build btusb Bluetooth USB Driver (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btusb-driver-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate btusb.ko
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Fetch Android common kernel Bluetooth sources
        shell: bash
        run: |
          set -euxo pipefail
          : "${KDIR:?DDK did not set KDIR}"
          : "${DDK_ROOT:?DDK_ROOT is not set}"
          test -f "$KDIR/Makefile"
          test -s "$KDIR/.config"
          grep -Eq '^CONFIG_BT=m$' "$KDIR/.config"
          grep -Eq '^CONFIG_USB=y$|^CONFIG_USB=m$' "$KDIR/.config"

          # The minimal DDK image contains the configured output/build tree,
          # not the in-tree Bluetooth driver sources.
          git clone --no-checkout https://android.googlesource.com/kernel/common "$GITHUB_WORKSPACE/kernel-common"
          cd "$GITHUB_WORKSPACE/kernel-common"
          git fetch --depth=1 origin adaba3e91947a078e89f9990010e3adc2aafce7b
          git checkout --detach FETCH_HEAD

          SRC="$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth"
          test -s "$SRC/btusb.c"
          test -s "$SRC/Makefile"
          test -s "$SRC/btintel.h"
          echo "Android common source: $(git rev-parse HEAD)"
          echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"

      - name: Configure and build btusb plus helper modules
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$GITHUB_WORKSPACE/kernel-common/drivers/bluetooth"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"

          scripts="$DDK_ROOT/src/android15-6.6/scripts/config"
          if [ ! -x "$scripts" ]; then
            scripts="$(find "$DDK_ROOT/src" -path '*/scripts/config' -type f -executable -print -quit)"
          fi
          test -n "$scripts"
          test -x "$scripts"

          # Enable the transport and its optional vendor helpers in the actual
          # DDK config, then regenerate generated headers before compiling.
          for option in BT_HCIBTUSB BT_INTEL BT_BCM BT_RTL BT_MTK BT_QCA; do
            "$scripts" --file "$KDIR/.config" -m "$option"
          done
          make -C "$KDIR" ARCH=arm64 LLVM=1 olddefconfig

          grep -Eq '^CONFIG_BT_HCIBTUSB=m$' "$KDIR/.config"
          grep -Eq '^CONFIG_BT_INTEL=m$' "$KDIR/.config"
          grep -E '^CONFIG_BT_(HCIBTUSB|INTEL|BCM|RTL|MTK|QCA)=' "$KDIR/.config"

          make -C "$KDIR" M="$SRC" ARCH=arm64 LLVM=1 clean
          make -C "$KDIR" M="$SRC" ARCH=arm64 LLVM=1 modules V=1

          test -s "$SRC/btusb.ko"
          install -m 0644 "$SRC/btusb.ko" "$OUT/btusb.ko"
          for module in btintel btbcm btrtl btmtk btqca; do
            if test -s "$SRC/$module.ko"; then
              install -m 0644 "$SRC/$module.ko" "$OUT/$module.ko"
            fi
          done

      - name: Validate module metadata and ARM64 ELF
        shell: bash
        run: |
          set -euo pipefail
          test -s out/btusb.ko
          file out/*.ko
          for module in out/*.ko; do
            modinfo "$module" | tee "out/$(basename "$module").modinfo.txt"
            modinfo -F vermagic "$module"
            llvm-readelf -h "$module" | grep -E 'Class:|Machine:'
          done
          {
            echo "Build image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "Android common source: adaba3e91947a078e89f9990010e3adc2aafce7b"
            echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Primary driver: btusb.ko (USB Bluetooth HCI transport)."
            echo "Helper modules are included when selected by the DDK config."
            echo "Compare exact device vermagic, symbol CRCs, dependencies, firmware and kernel config before loading."
            echo "Build/package only; no device installation or module loading."
          } | tee out/README.txt
          (cd out && sha256sum *.ko > SHA256SUMS)

      - name: Upload Bluetooth USB driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btusb-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
