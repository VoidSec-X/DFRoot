name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android15-6.6
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

      - name: Build RTL8188EUS module
        if: matrix.kmi == 'android15-6.6'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu
          cd rtl8188eu

          # Use the same DDK kernel build environment as dfroot.ko.
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 clean

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(source.replace(old, new, 1))

          # Convert zero/one-element trailing arrays to C flexible arrays.
          p = Path("include/ieee80211.h")
          source = p.read_text()
          start = source.index("struct ieee80211_info_element {")
          end = source.index("} __attribute__((packed));", start)
          block = source[start:end]
          if "u8 data[0];" not in block:
              raise SystemExit("ieee80211_info_element: data[0] declaration not found")
          source = source[:start] + block.replace("u8 data[0];", "u8 data[];", 1) + source[end:]
          p.write_text(source)

          # Convert the zero-length crypt.key tail to a C flexible array.
          # This preserves the ioctl wire layout while avoiding Clang 6.6
          # treating key[16]/key[24] offsets as out-of-bounds.
          p = Path("include/ieee80211.h")
          source = p.read_text()
          start = source.index("struct ieee_param {")
          end = source.index("} ieee_param;", start)
          block = source[start:end]
          if "u8 key[0];" not in block:
              raise SystemExit("ieee_param crypt.key: key[0] declaration not found")
          source = source[:start] + block.replace("u8 key[0];", "u8 key[];", 1) + source[end:]
          p.write_text(source)

          p = Path("include/wlan_bssdef.h")
          source = p.read_text()
          marker = "struct _NDIS_802_11_VARIABLE_IEs"
          start = source.index(marker)
          end = source.index("};", start)
          block = source[start:end]
          if "data[1]" not in block:
              raise SystemExit("NDIS variable IE: data[1] declaration not found")
          block = block.replace("data[1]", "data[]", 1)
          p.write_text(source[:start] + block + source[end:])

          # Add explicit breaks after conditional RSN returns.
          # Some upstream revisions contain an additional RSN case, so patch
          # each matching return branch instead of assuming a fixed case count.
          p = Path("core/rtw_wlan_util.c")
          lines = p.read_text().splitlines()
          inserts = []
          for n, line in enumerate(lines):
              if line.strip() != "case _RSN_IE_2_:":
                  continue
              stop = next((m for m in range(n + 1, len(lines))
                           if lines[m].strip().startswith(("case ", "default:"))), len(lines))
              for m in range(n + 1, stop):
                  if lines[m].strip() in ("return _TRUE;", "return _FALSE;"):
                      if m + 1 >= len(lines) or lines[m + 1].strip() != "break;":
                          indent = line[:len(line) - len(line.lstrip())]
                          inserts.append((m + 1, indent + "break;"))
                      break
          if not inserts:
              raise SystemExit("no RSN conditional return branches found to patch")
          for index, statement in reversed(inserts):
              lines.insert(index, statement)
          p.write_text("\n".join(lines) + "\n")

          # Keep the upstream wiphy interface; this build's driver config
          # defines cfg80211, but does not select RTW_SINGLE_WIPHY. The
          # adapter member is present under CONFIG_IOCTL_CFG80211 alone in
          # non-single-wiphy mode. Select this mode explicitly to match
          # adapter_to_wiphy(adapter) == adapter->wiphy.
          p = Path("include/autoconf.h")
          source = p.read_text()
          if "#define CONFIG_IOCTL_CFG80211" not in source:
              import re
              source, count = re.subn(r"^\s*/\*\s*#define CONFIG_IOCTL_CFG80211\s*\*/",
                                     "#define CONFIG_IOCTL_CFG80211", source, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit("autoconf.h: cannot enable CONFIG_IOCTL_CFG80211")
          if "#define RTW_SINGLE_WIPHY" in source:
              raise SystemExit("RTW_SINGLE_WIPHY unexpectedly enabled; refusing to change wiphy mode")

          # Keep CONFIG_P2P enabled. The station driver retains its upstream
          # P2P callbacks and timer lifecycle; do not rewrite cfg80211 ops here.

          # The RTL8188EUS ops table places set_mac_acl inside CONFIG_AP_MODE,
          # but preinit used to advertise max_acl_mac_addrs whenever ACL was enabled.
          # cfg80211 rejects wiphy_register() when the limit is nonzero and the
          # callback is absent. ACL is an AP feature, so advertise it only with AP mode.
          p = Path("os_dep/linux/ioctl_cfg80211.c")
          source = p.read_text()
          old = """#if CONFIG_RTW_MACADDR_ACL && (LINUX_VERSION_CODE >= KERNEL_VERSION(3, 9, 0))
          \twiphy->max_acl_mac_addrs = NUM_ACL;
          #endif"""
          new = """#if defined(CONFIG_AP_MODE) && CONFIG_RTW_MACADDR_ACL && (LINUX_VERSION_CODE >= KERNEL_VERSION(3, 9, 0))
          \twiphy->max_acl_mac_addrs = NUM_ACL;
          #endif"""
          if source.count(old) != 1:
              raise SystemExit("ioctl_cfg80211.c: cannot gate max_acl_mac_addrs on CONFIG_AP_MODE")
          p.write_text(source.replace(old, new, 1))

          # Add precise runtime diagnostics around cfg80211/netdev registration.
          p = Path("os_dep/linux/ioctl_cfg80211.c")
          source = p.read_text()
          old = "\treturn wiphy_register(wiphy);"
          new = """\t{
          \t\tint ret = wiphy_register(wiphy);
          \t\tpr_err("DFROOT: wiphy_register(%p) returned %d\\n", wiphy, ret);
          \t\treturn ret;
          \t}"""
          if source.count(old) != 1:
              raise SystemExit("ioctl_cfg80211.c: cannot locate wiphy_register return")
          source = source.replace(old, new, 1)
          old = "\twiphy = wiphy_new(&rtw_cfg80211_ops, sizeof(struct rtw_wiphy_data));"
          new = """\tpr_err("DFROOT: ops remain=%p cancel_remain=%p start_p2p=%p stop_p2p=%p set_mac_acl=%p\\n",
          \t\t (void *)rtw_cfg80211_ops.remain_on_channel,
          \t\t (void *)rtw_cfg80211_ops.cancel_remain_on_channel,
          \t\t (void *)rtw_cfg80211_ops.start_p2p_device,
          \t\t (void *)rtw_cfg80211_ops.stop_p2p_device,
          \t\t (void *)rtw_cfg80211_ops.set_mac_acl);
          \twiphy = wiphy_new(&rtw_cfg80211_ops, sizeof(struct rtw_wiphy_data));"""
          if source.count(old) != 1:
              raise SystemExit("ioctl_cfg80211.c: cannot locate wiphy_new call")
          source = source.replace(old, new, 1)
          p.write_text(source)

          p = Path("os_dep/linux/os_intfs.c")
          source = p.read_text()
          old = """\tif (rtnl_lock_needed)
          \t\tret = (register_netdev(ndev) == 0) ? _SUCCESS : _FAIL;
          \telse
          \t\tret = (register_netdevice(ndev) == 0) ? _SUCCESS : _FAIL;"""
          new = """\tif (rtnl_lock_needed)
          \t\tret = register_netdev(ndev);
          \telse
          \t\tret = register_netdevice(ndev);
          \tif (ret) {
          \t\tpr_err("DFROOT: netdev registration failed name=%s errno=%d\\n",
          \t\t\tndev->name, ret);
          \t\tret = _FAIL;
          \t} else {
          \t\tpr_err("DFROOT: netdev registered name=%s\\n", ndev->name);
          \t\tret = _SUCCESS;
          \t}"""
          if source.count(old) != 1:
              raise SystemExit("os_intfs.c: cannot locate netdev registration block")
          p.write_text(source.replace(old, new, 1))

          # Android 15 exports filp_open() and kernel_read() in the VFS namespace.
          # Import that namespace so modpost metadata permits loading this driver.
          p = Path("os_dep/osdep_service.c")
          source = p.read_text()
          import_stmt = "MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);"
          if import_stmt not in source:
              source = source.rstrip() + "\n\n" + import_stmt + "\n"
          p.write_text(source)

          # Linux 6.x cfg80211 needs the wiphy parent device set before registration.
          # rtw_wiphy_alloc() lives in ioctl_cfg80211.c; it already receives the dvobj
          # device, so patch its real allocation implementation, not os_intfs.c.
          p = Path("os_dep/linux/ioctl_cfg80211.c")
          source = p.read_text()
          marker = "struct wiphy *rtw_wiphy_alloc(_adapter *padapter, struct device *dev)\n{"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("ioctl_cfg80211.c: rtw_wiphy_alloc definition not found")
          end = source.find("\n}", start)
          if end < 0:
              raise SystemExit("ioctl_cfg80211.c: end of rtw_wiphy_alloc not found")
          block = source[start:end]
          if "set_wiphy_dev(wiphy, dev);" not in block:
              anchor = "\twiphy = wiphy_new("
              if anchor not in block:
                  raise SystemExit("rtw_wiphy_alloc: wiphy_new allocation not found")
              block = block.replace(anchor, anchor, 1)
              alloc_end = block.find(";", block.find(anchor))
              if alloc_end < 0:
                  raise SystemExit("rtw_wiphy_alloc: wiphy_new statement end not found")
              block = (block[:alloc_end + 1] +
                       "\n#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 0, 0))\n"
                       "\tset_wiphy_dev(wiphy, dev);\n#endif" +
                       block[alloc_end + 1:])
              source = source[:start] + block + source[end:]
              p.write_text(source)
          else:
              print("rtw_wiphy_alloc: set_wiphy_dev already present; skipping")


          # Linux 6.6 removed the legacy association/disassociation helpers.
          # Replace the existing compatibility macro in-place, keeping exactly
          # one definition and preserving the original cfg80211 notification flow.
          p = Path("os_dep/linux/ioctl_cfg80211.h")
          source = p.read_text()
          old_block = """#if (LINUX_VERSION_CODE < KERNEL_VERSION(3, 4, 0))  && !defined(COMPAT_KERNEL_RELEASE)
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, buf, len)
          #else
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, bss, buf, len)
          #endif"""
          new_block = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 0, 0)
          #define rtw_cfg80211_send_rx_assoc(adapter, arg_bss, arg_buf, arg_len) \\
          do { \\
              struct cfg80211_rx_assoc_resp assoc_resp = { \\
                  .buf = (arg_buf), \\
                  .len = (arg_len), \\
                  .req_ies = NULL, \\
                  .req_ies_len = 0, \\
              }; \\
              assoc_resp.links[0].bss = (arg_bss); \\
              cfg80211_rx_assoc_resp((adapter)->pnetdev, &assoc_resp); \\
          } while (0)
          #elif (LINUX_VERSION_CODE < KERNEL_VERSION(3, 4, 0)) && !defined(COMPAT_KERNEL_RELEASE)
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, buf, len)
          #else
          #define rtw_cfg80211_send_rx_assoc(adapter, bss, buf, len) cfg80211_send_rx_assoc((adapter)->pnetdev, bss, buf, len)
          #endif"""
          if source.count(old_block) != 1:
              raise SystemExit("ioctl_cfg80211.h: expected original association macro block exactly once")
          source = source.replace(old_block, new_block, 1)
          p.write_text(source)

          p = Path("os_dep/linux/ioctl_cfg80211.c")
          source = p.read_text()
          old = "cfg80211_send_disassoc(padapter->pnetdev, mgmt_buf, frame_len);"
          new = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 0, 0)
          	cfg80211_tx_mlme_mgmt(padapter->pnetdev, mgmt_buf, frame_len, false);
          #else
          	cfg80211_send_disassoc(padapter->pnetdev, mgmt_buf, frame_len);
          #endif"""
          if source.count(old) != 1:
              raise SystemExit("ioctl_cfg80211.c: expected one cfg80211_send_disassoc call")
          source = source.replace(old, new, 1)
          p.write_text(source)

          # PHYDM TXAGC offset windows are bounded; OR made every value valid.
          p = Path("hal/phydm/phydm_api.c")
          source = p.read_text()
          old = "if (power_offset > -8 || power_offset < 7)"
          new = "if (power_offset > -8 && power_offset < 7)"
          if source.count(old) != 1:
              raise SystemExit("phydm_api.c: expected one 11N TXAGC range condition")
          source = source.replace(old, new, 1)
          p.write_text(source)

          # Fix impossible PHYDM condition: a value cannot be both != 1 and != 2.
          p = Path("hal/phydm/phydm_debug.c")
          source = p.read_text()
          old = "if (rx_ht != 2 || rx_ht != 1)"
          new = "if (rx_ht != 2 && rx_ht != 1)"
          if source.count(old) != 1:
              raise SystemExit("phydm_debug.c: expected one impossible rx_ht condition")
          p.write_text(source.replace(old, new, 1))

          # Clang 6.6 diagnoses redundant parentheses around this comparison.
          p = Path("hal/rtl8188e/usb/usb_halinit.c")
          source = p.read_text()
          old = "if ((IS_FULL_SPEED_USB(Adapter))"
          new = "if (IS_FULL_SPEED_USB(Adapter)"
          if source.count(old) != 1:
              raise SystemExit("usb_halinit.c: expected exactly one redundant-parentheses condition")
          p.write_text(source.replace(old, new, 1))

          # Clang 6.6 treats the intentional-looking spinlock switch fallthrough
          # as an error. These cases have no shared cleanup; terminate explicitly.
          p = Path("core/rtw_odm.c")
          source = p.read_text()
          for call in (
              "_enter_critical_bh(&pHalData->IQKSpinLock, &irqL);",
              "_exit_critical_bh(&pHalData->IQKSpinLock, &irqL);",
          ):
              old = call + "\n\tdefault:"
              new = call + "\n\t\tbreak;\n\tdefault:"
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"rtw_odm.c: expected one {call} before default, found {count}")
              source = source.replace(old, new, 1)
          p.write_text(source)

          # Preserve legacy driver internals behind one precisely typed ndo_start_xmit wrapper.
          p = Path("include/xmit_osdep.h")
          source = p.read_text()
          decl = "extern netdev_tx_t rtw_xmit_entry(struct sk_buff *pkt, struct net_device *pnetdev);"
          old_decl = "extern int rtw_xmit_entry(_pkt *pkt, _nic_hdl pnetdev);"
          if old_decl in source:
              source = source.replace(old_decl, decl, 1)
          elif decl not in source:
              raise SystemExit("xmit_osdep.h: rtw_xmit_entry declaration missing")
          p.write_text(source)

          p = Path("os_dep/linux/xmit_linux.c")
          source = p.read_text()
          old_sig = "int rtw_xmit_entry(_pkt *pkt, _nic_hdl pnetdev)"
          broad_sig = "netdev_tx_t rtw_xmit_entry(struct sk_buff *pkt, struct net_device *pnetdev)"
          if broad_sig in source:
              source = source.replace(broad_sig, old_sig, 1)
          if source.count(old_sig) != 1:
              raise SystemExit("xmit_linux.c: expected exactly one legacy rtw_xmit_entry body")
          source = source.replace(old_sig,
              "static int rtw_xmit_entry_legacy(_pkt *pkt, _nic_hdl pnetdev)", 1)
          wrapper = r"""
          /*
           * Exact net_device_ops::ndo_start_xmit ABI boundary.
           * Do not cast the callback itself; the legacy helper stays private.
           */
          netdev_tx_t rtw_xmit_entry(struct sk_buff *skb, struct net_device *dev)
          {
              return (netdev_tx_t)rtw_xmit_entry_legacy((_pkt *)skb, (_nic_hdl)dev);
          }

          _Static_assert(__same_type(&rtw_xmit_entry,
              ((struct net_device_ops *)0)->ndo_start_xmit),
              "rtw_xmit_entry must exactly match ndo_start_xmit ABI");
          """
          if "netdev_tx_t rtw_xmit_entry(struct sk_buff *skb, struct net_device *dev)" in source:
              raise SystemExit("xmit_linux.c: duplicate ndo_start_xmit wrapper")
          source = source.rstrip() + "\n" + wrapper + "\n"
          p.write_text(source)

          # Every ndo_start_xmit implementation must use netdev_tx_t.
          for path, old_sig, new_sig in (
              ("os_dep/linux/ioctl_cfg80211.c",
               "static int rtw_cfg80211_monitor_if_xmit_entry(struct sk_buff *skb, struct net_device *ndev)",
               "static netdev_tx_t rtw_cfg80211_monitor_if_xmit_entry(struct sk_buff *skb, struct net_device *ndev)"),
              ("os_dep/linux/mlme_linux.c",
               "static int mgnt_xmit_entry(struct sk_buff *skb, struct net_device *pnetdev)",
               "static netdev_tx_t mgnt_xmit_entry(struct sk_buff *skb, struct net_device *pnetdev)"),
          ):
              p = Path(path)
              source = p.read_text()
              if source.count(old_sig) == 1:
                  source = source.replace(old_sig, new_sig, 1)
              elif source.count(new_sig) != 1:
                  raise SystemExit(f"{path}: expected exactly one xmit callback")
              p.write_text(source)

          PY

          # Use complete DDK-generated headers/config. Never splice one header
          # from an unrelated kernel tree into this build.
          echo "DDK kernelrelease: $(make -s -C "$KDIR" kernelrelease)"
          echo "DDK compiler: $(clang --version | head -n1)"
          test -f "$KDIR/.config"
          test -f "$KDIR/include/generated/autoconf.h"
          test -f "$KDIR/include/config/auto.conf"
          echo "Relevant generated config:"
          grep -E '^(CONFIG_CFI_CLANG|CONFIG_CFI_PERMISSIVE|CONFIG_NL80211_TESTMODE|CONFIG_MODVERSIONS|CONFIG_LTO_CLANG)=' "$KDIR/.config" || true
          grep -E 'CONFIG_CFI_CLANG|CONFIG_NL80211_TESTMODE|CONFIG_MODVERSIONS|CONFIG_LTO_CLANG' "$KDIR/include/generated/autoconf.h" || true

          # This artifact is testmode-y only. Do not fake Kconfig values using KCFLAGS.
          grep -q '^CONFIG_NL80211_TESTMODE=y$' "$KDIR/.config" || { echo "::error::DDK .config lacks CONFIG_NL80211_TESTMODE=y"; exit 1; }
          grep -q '^#define CONFIG_NL80211_TESTMODE 1$' "$KDIR/include/generated/autoconf.h" || { echo "::error::generated autoconf.h lacks CONFIG_NL80211_TESTMODE"; exit 1; }

          # Compile-time ABI diagnostics are fatal; print KCFI metadata for review.
          mkdir -p "$GITHUB_WORKSPACE/out"
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 \
            CONFIG_RTL8188EU=m CONFIG_RTL8188E=y CONFIG_USB_HCI=y \
            CONFIG_PLATFORM_ANDROID_ARM64=y CONFIG_PLATFORM_I386_PC=n \
            KCFLAGS="-Werror=incompatible-function-pointer-types -DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE -DCONFIG_IOCTL_CFG80211" modules
          test -s 8188eu.ko
          llvm-readelf -h 8188eu.ko | grep -q AArch64
          llvm-nm -a 8188eu.ko | grep -E 'rtw_xmit_entry|__kcfi_typeid_rtw_xmit_entry'
          llvm-readelf -S 8188eu.ko | grep -Ei 'kcfi|llvm'
          llvm-readelf -p .modinfo 8188eu.ko
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-android15-6.6-testmode-y.ko"
          sha256sum "$GITHUB_WORKSPACE/out/8188eu-android15-6.6-testmode-y.ko"
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 clean

      - name: Upload RTL8188EUS.ko
        if: matrix.kmi == 'android15-6.6'
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-${{ matrix.kmi }}
          path: out/8188eu-${{ matrix.kmi }}*.ko
          if-no-files-found: error

