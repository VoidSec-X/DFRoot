name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

      - name: Build RTL8188EUS module
        if: matrix.kmi == 'android16-6.12'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eu
          cd rtl8188eu

          # Match the in-repo LKM Makefile's DDK environment and build invocation.
          make -C "$KDIR" M="$PWD" clean
          find . -type f \\( -name '*.o' -o -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name '*.cmd' \\) -delete

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"{path}: expected one exact match, got {s.count(old)}")
              p.write_text(s.replace(old, new, 1))

          p = Path("include/ieee80211.h")
          replace_once(
              "include/ieee80211.h",
              "struct ieee80211_info_element {\\n\\tu8 id;\\n\\tu8 len;\\n\\tu8 data[0];\\n} __attribute__((packed));",
              "struct ieee80211_info_element {\\n\\tu8 id;\\n\\tu8 len;\\n\\tu8 data[];\\n} __attribute__((packed));"
          )
          replace_once(
              "include/wlan_bssdef.h",
              "\\tu8  data[1];",
              "\\tu8  data[];"
          )

          # Correctly terminate the two RSN switch branches reported by Clang.
          p = Path("core/rtw_wlan_util.c")
          s = p.read_text()
          patterns = [
              (r"(case _RSN_IE_2_:\\n\\s*if \\(_rtw_memcmp\\(\\(pIE->data \\+ 8\\), RSN_TKIP_CIPHER, 4\\)\\)\\n\\s*return _TRUE;)\\n(\\s*default:)",
               r"\\1\\n\\t\\t\\t\\tbreak;\\n\\n\\t\\t\\t\\2"),
              (r"(case _RSN_IE_2_:\\n\\s*if \\(\\(_rtw_memcmp\\(\\(pIE->data \\+ 8\\), RSN_CIPHER_SUITE_CCMP, 4\\)\\)\\s*\\|\\|\\s*\\(_rtw_memcmp\\(\\(pIE->data \\+ 12\\), RSN_CIPHER_SUITE_CCMP, 4\\)\\)\\)\\n\\s*return _FALSE;)\\n(\\s*default:)",
               r"\\1\\n\\t\\t\\t\\tbreak;\\n\\n\\t\\t\\t\\2")
          ]
          for pattern, repl in patterns:
              s, n = re.subn(pattern, repl, s, count=1)
              if n != 1:
                  raise SystemExit(f"RSN switch fall-through patch match count={n}")
          p.write_text(s)
          PY

          # Build like lkm/Makefile: DDK-provided KDIR/OBJCOPY, no extra
          # CROSS_COMPILE or warning-suppression overrides.
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 \\
            CONFIG_RTL8188EU=m CONFIG_RTL8188E=y CONFIG_USB_HCI=y \\
            CONFIG_PLATFORM_ANDROID_ARM64=y CONFIG_PLATFORM_I386_PC=n \\
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DODM_ENDIAN_TYPE=ODM_ENDIAN_LITTLE" \\
            modules

          test -s 8188eu.ko
          llvm-objcopy --strip-unneeded \\
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \\
            -R .note.Linux -R .note.GNU-stack \\
            -R .BTF -R .BTF.base -R .llvm_addrsig \\
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \\
            -R .hyp.patchable_function_entries -R .hyp.data 8188eu.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp 8188eu.ko "$GITHUB_WORKSPACE/out/8188eu-${{ matrix.kmi }}.ko"
          make -C "$KDIR" M="$PWD" ARCH=arm64 LLVM=1 clean

      - name: Upload RTL8188EUS.ko
        if: matrix.kmi == 'android16-6.12'
        uses: actions/upload-artifact@v7
        with:
          name: rtl8188eus-${{ matrix.kmi }}
          path: out/8188eu-${{ matrix.kmi }}.ko
          if-no-files-found: error

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate signing config
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ secrets.KEYSTORE }}" = "" ]; then
            echo "::error::Signing secrets not configured. KEYSTORE secret is required for release builds."
            exit 1
          fi

      - name: Create signing.properties
        if: github.event_name != 'pull_request'
        run: |
          echo KEYSTORE_FILE=../keystore.jks > signing.properties
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} >> signing.properties
          echo KEY_ALIAS=${{ secrets.KEY_ALIAS }} >> signing.properties
          echo KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} >> signing.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - name: Download RTL8188EUS module
        uses: actions/download-artifact@v7
        with:
          name: rtl8188eus-android16-6.12
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot
          path: |
            app/build/outputs/apk/release/DFRoot_*.apk
            app/build/outputs/apk/debug/DFRoot_*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/DFRoot_*.apk
