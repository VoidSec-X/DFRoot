name: Build CP210x USB-Serial Driver (Android 15 GKI 6.6)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cp210x-driver-6.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate cp210x.ko
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828

    steps:
      - name: Check DDK kernel build tree and USB-serial prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KDIR:-}" && test -f "$KDIR/Makefile" || {
            echo "::error::DDK kernel build tree (KDIR) is unavailable."
            exit 1
          }
          echo "KDIR=$KDIR"
          echo "DDK kernel release: $(make -s -C "$KDIR" kernelrelease)"
          if ! grep -Eq '^CONFIG_USB_SERIAL=(m|y)$' "$KDIR/.config"; then
            echo "::error::CONFIG_USB_SERIAL is not enabled in the DDK config."
            exit 1
          fi
          grep -E '^CONFIG_(USB|USB_SERIAL|TTY)' "$KDIR/.config" | sort || true

      - name: Fetch CP210x source from Linux v6.6
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v6.6 https://github.com/torvalds/linux.git "$GITHUB_WORKSPACE/linux-source"
          install -m 0644 "$GITHUB_WORKSPACE/linux-source/drivers/usb/serial/cp210x.c" "$GITHUB_WORKSPACE/cp210x.c"
          grep -q 'module_usb_serial_driver' "$GITHUB_WORKSPACE/cp210x.c"
          grep -q 'MODULE_LICENSE' "$GITHUB_WORKSPACE/cp210x.c"

      - name: Build cp210x.ko against Android 15 DDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          printf 'obj-m += cp210x.o\n' > "$GITHUB_WORKSPACE/Makefile"
          make -C "$KDIR" M="$GITHUB_WORKSPACE" ARCH=arm64 LLVM=1 modules V=1
          test -s "$GITHUB_WORKSPACE/cp210x.ko"
          install -m 0644 "$GITHUB_WORKSPACE/cp210x.ko" "$GITHUB_WORKSPACE/out/cp210x.ko"

      - name: Validate module metadata and ARM64 ELF
        shell: bash
        run: |
          set -euo pipefail
          file out/cp210x.ko
          modinfo out/cp210x.ko | tee out/modinfo.txt
          grep -q '^name: *cp210x' out/modinfo.txt
          modinfo -F vermagic out/cp210x.ko | tee out/module-vermagic.txt
          llvm-readelf -h out/cp210x.ko | grep -E 'Class:|Machine:'
          {
            echo "Build image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828"
            echo "Kernel release: $(make -s -C "$KDIR" kernelrelease)"
            echo "Driver purpose: Silicon Labs CP210x USB-to-UART adapters."
            echo "Built against the DDK kernel, not the phone's exact 6.6.118 build."
            echo "Check vermagic, symbol CRCs, exported USB-serial symbols and kernel config before attempting to load."
            echo "Build/package only: this workflow does not install or load the module on a device."
          } | tee out/README.txt
          sha256sum out/cp210x.ko | tee out/SHA256SUMS

      - name: Upload CP210x module artifact
        uses: actions/upload-artifact@v4
        with:
          name: cp210x-android15-6.6
          path: out/
          if-no-files-found: error
          retention-days: 14
